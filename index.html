<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>B&B AI</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           THEME
        ===================================================== */

        :root {

            --bg: #ffffff;

            --surface: #f7f7f7;

            --surface-hover: #eeeeee;

            --input: #ffffff;

            --text: #111111;

            --muted: #707070;

            --border: #dddddd;

            --button: #111111;

            --button-text: #ffffff;

            --error: #d93025;

            --success: #16833b;

        }


        body.dark {

            --bg: #090909;

            --surface: #151515;

            --surface-hover: #202020;

            --input: #101010;

            --text: #ffffff;

            --muted: #a0a0a0;

            --border: #303030;

            --button: #ffffff;

            --button-text: #000000;

            --error: #ff6464;

            --success: #4ade80;

        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            min-height: 100vh;

            background: var(--bg);

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                background 0.2s ease,
                color 0.2s ease;

        }


        /* =====================================================
           THEME BUTTON
        ===================================================== */

        .theme-button {

            position: fixed;

            top: 22px;

            right: 22px;

            width: 42px;

            height: 42px;

            border: 1px solid var(--border);

            border-radius: 50%;

            background: var(--surface);

            color: var(--text);

            cursor: pointer;

            font-size: 17px;

            display: flex;

            align-items: center;

            justify-content: center;

            transition: 0.2s;

        }


        .theme-button:hover {

            background: var(--surface-hover);

        }


        /* =====================================================
           AUTH WRAPPER
        ===================================================== */

        .auth-wrapper {

            width: 100%;

            max-width: 420px;

            padding: 20px;

        }


        /* =====================================================
           AUTH BOX
        ===================================================== */

        .auth-box {

            width: 100%;

            padding: 36px;

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 20px;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.07);

        }


        body.dark .auth-box {

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.35);

        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {

            text-align: center;

            margin-bottom: 28px;

        }


        .brand-logo {

            width: 64px;

            height: 64px;

            object-fit: contain;

            border-radius: 16px;

            margin-bottom: 14px;

        }


        .brand-name {

            font-size: 28px;

            font-weight: 750;

            letter-spacing: -0.8px;

        }


        .brand-subtitle {

            margin-top: 7px;

            color: var(--muted);

            font-size: 14px;

        }


        /* =====================================================
           TABS
        ===================================================== */

        .tabs {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 4px;

            padding: 4px;

            margin-bottom: 24px;

            background: var(--surface-hover);

            border-radius: 10px;

        }


        .tab {

            height: 38px;

            border: none;

            border-radius: 7px;

            background: transparent;

            color: var(--muted);

            cursor: pointer;

            font-size: 14px;

            font-weight: 650;

            transition: 0.2s;

        }


        .tab.active {

            background: var(--bg);

            color: var(--text);

            box-shadow:
                0 1px 5px rgba(0, 0, 0, 0.08);

        }


        /* =====================================================
           FORM
        ===================================================== */

        .form {

            display: none;

        }


        .form.active {

            display: block;

        }


        /* =====================================================
           FIELD
        ===================================================== */

        .field {

            margin-bottom: 16px;

        }


        .field label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 600;

        }


        .field input {

            width: 100%;

            height: 46px;

            padding: 0 13px;

            border: 1px solid var(--border);

            border-radius: 9px;

            outline: none;

            background: var(--input);

            color: var(--text);

            font-size: 14px;

            transition: 0.2s;

        }


        .field input::placeholder {

            color: var(--muted);

        }


        .field input:focus {

            border-color: var(--text);

        }


        /* =====================================================
           SUBMIT BUTTON
        ===================================================== */

        .submit-button {

            width: 100%;

            height: 46px;

            margin-top: 4px;

            border: none;

            border-radius: 9px;

            background: var(--button);

            color: var(--button-text);

            cursor: pointer;

            font-size: 14px;

            font-weight: 700;

            transition: 0.2s;

        }


        .submit-button:hover {

            opacity: 0.86;

        }


        .submit-button:disabled {

            opacity: 0.55;

            cursor: not-allowed;

        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {

            min-height: 20px;

            margin-top: 15px;

            text-align: center;

            font-size: 13px;

            line-height: 1.5;

        }


        .message.error {

            color: var(--error);

        }


        .message.success {

            color: var(--success);

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {

            margin-top: 22px;

            text-align: center;

            color: var(--muted);

            font-size: 12px;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            display: none;

            margin-top: 12px;

            text-align: center;

            color: var(--muted);

            font-size: 12px;

        }


        .loading.show {

            display: block;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            .auth-wrapper {

                padding: 14px;

            }

            .auth-box {

                padding: 27px 20px;

            }

            .theme-button {

                top: 14px;

                right: 14px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         THEME
    ===================================================== -->

    <button
        id="themeButton"
        class="theme-button"
        type="button"
        aria-label="Change theme"
    >
        ☾
    </button>



    <!-- =====================================================
         AUTH
    ===================================================== -->

    <main class="auth-wrapper">

        <section class="auth-box">


            <!-- BRAND -->

            <div class="brand">

                <img
                    src="logo.jpg"
                    alt="B&B AI"
                    class="brand-logo"
                    onerror="this.style.display='none'"
                >

                <div class="brand-name">
                    B&B AI
                </div>

                <div class="brand-subtitle">
                    Your AI workspace
                </div>

            </div>



            <!-- TABS -->

            <div class="tabs">

                <button
                    id="loginTab"
                    class="tab active"
                    type="button"
                >
                    Login
                </button>

                <button
                    id="signupTab"
                    class="tab"
                    type="button"
                >
                    Sign Up
                </button>

            </div>



            <!-- =================================================
                 LOGIN FORM
            ================================================= -->

            <form
                id="loginForm"
                class="form active"
            >

                <div class="field">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        id="loginEmail"
                        type="email"
                        autocomplete="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="field">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        id="loginPassword"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    id="loginButton"
                    class="submit-button"
                    type="submit"
                >
                    Login
                </button>

            </form>



            <!-- =================================================
                 SIGN UP FORM
            ================================================= -->

            <form
                id="signupForm"
                class="form"
            >

                <div class="field">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        id="signupEmail"
                        type="email"
                        autocomplete="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="field">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        id="signupPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="field">

                    <label for="signupConfirmPassword">
                        Confirm Password
                    </label>

                    <input
                        id="signupConfirmPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Repeat your password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    id="signupButton"
                    class="submit-button"
                    type="submit"
                >
                    Create Account
                </button>

            </form>



            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
                aria-live="polite"
            ></div>


            <!-- LOADING -->

            <div
                id="loading"
                class="loading"
            >
                Please wait...
            </div>


            <!-- FOOTER -->

            <div class="footer">
                B&B AI · B&B Studio
            </div>


        </section>

    </main>



    <!-- =====================================================
         SUPABASE LIBRARY
    ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =====================================================
         B&B AI CONFIG
    ===================================================== -->

    <script src="api.js"></script>



    <!-- =====================================================
         AUTH SCRIPT
    ===================================================== -->

    <script>

        /* =====================================================
           CHECK CONFIGURATION
        ===================================================== */

        if (
            typeof BBAI_CONFIG === "undefined" ||
            !BBAI_CONFIG.supabase
        ) {

            document.body.innerHTML = `
                <div style="
                    font-family: Arial, sans-serif;
                    padding: 40px;
                    text-align: center;
                ">
                    B&B AI configuration could not be loaded.
                </div>
            `;

            throw new Error(
                "BBAI_CONFIG is not available."
            );

        }



        /* =====================================================
           CREATE SUPABASE CLIENT
        ===================================================== */

        const supabaseClient =
            window.supabase.createClient(

                BBAI_CONFIG.supabase.url,

                BBAI_CONFIG.supabase.publishableKey

            );



        /* =====================================================
           ELEMENTS
        ===================================================== */

        const loginTab =
            document.getElementById("loginTab");

        const signupTab =
            document.getElementById("signupTab");

        const loginForm =
            document.getElementById("loginForm");

        const signupForm =
            document.getElementById("signupForm");

        const loginButton =
            document.getElementById("loginButton");

        const signupButton =
            document.getElementById("signupButton");

        const message =
            document.getElementById("message");

        const loading =
            document.getElementById("loading");

        const themeButton =
            document.getElementById("themeButton");



        /* =====================================================
           MESSAGE HELPERS
        ===================================================== */

        function showMessage(
            text,
            type = "error"
        ) {

            message.textContent = text;

            message.className =
                `message ${type}`;

        }


        function clearMessage() {

            message.textContent = "";

            message.className =
                "message";

        }



        /* =====================================================
           LOADING
        ===================================================== */

        function setLoading(
            state
        ) {

            loading.classList.toggle(
                "show",
                state
            );

            loginButton.disabled =
                state;

            signupButton.disabled =
                state;

        }



        /* =====================================================
           TABS
        ===================================================== */

        loginTab.addEventListener(
            "click",
            () => {

                loginTab.classList.add(
                    "active"
                );

                signupTab.classList.remove(
                    "active"
                );

                loginForm.classList.add(
                    "active"
                );

                signupForm.classList.remove(
                    "active"
                );

                clearMessage();

            }
        );


        signupTab.addEventListener(
            "click",
            () => {

                signupTab.classList.add(
                    "active"
                );

                loginTab.classList.remove(
                    "active"
                );

                signupForm.classList.add(
                    "active"
                );

                loginForm.classList.remove(
                    "active"
                );

                clearMessage();

            }
        );



        /* =====================================================
           LOGIN
        ===================================================== */

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                clearMessage();

                const email =
                    document
                        .getElementById(
                            "loginEmail"
                        )
                        .value
                        .trim();

                const password =
                    document
                        .getElementById(
                            "loginPassword"
                        )
                        .value;


                if (!email || !password) {

                    showMessage(
                        "Please enter your email and password."
                    );

                    return;

                }


                setLoading(true);


                try {

                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth
                            .signInWithPassword({

                                email: email,

                                password: password

                            });


                    if (error) {

                        throw error;

                    }


                    if (!data.session) {

                        throw new Error(
                            "Login succeeded but no session was created."
                        );

                    }


                    showMessage(
                        "Login successful. Opening B&B AI...",
                        "success"
                    );


                    setTimeout(
                        () => {

                            window.location.replace(
                                "text.html"
                            );

                        },
                        500
                    );


                } catch (error) {

                    console.error(
                        "B&B AI Login Error:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Login failed."
                    );

                    setLoading(false);

                }

            }
        );



        /* =====================================================
           SIGN UP
        ===================================================== */

        signupForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                clearMessage();


                const email =
                    document
                        .getElementById(
                            "signupEmail"
                        )
                        .value
                        .trim();

                const password =
                    document
                        .getElementById(
                            "signupPassword"
                        )
                        .value;

                const confirmPassword =
                    document
                        .getElementById(
                            "signupConfirmPassword"
                        )
                        .value;


                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "Passwords do not match."
                    );

                    return;

                }


                if (password.length < 6) {

                    showMessage(
                        "Password must be at least 6 characters."
                    );

                    return;

                }


                setLoading(true);


                try {

                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth
                            .signUp({

                                email: email,

                                password: password

                            });


                    if (error) {

                        throw error;

                    }


                    /*
                     * If email confirmation is enabled,
                     * Supabase may create the user but
                     * not create an active session yet.
                     */

                    if (
                        data.user &&
                        !data.session
                    ) {

                        showMessage(
                            "Account created. Please check your email to confirm your account.",
                            "success"
                        );

                        setLoading(false);

                        return;

                    }


                    if (data.session) {

                        showMessage(
                            "Account created. Opening B&B AI...",
                            "success"
                        );


                        setTimeout(
                            () => {

                                window.location.replace(
                                    "text.html"
                                );

                            },
                            500
                        );

                        return;

                    }


                    showMessage(
                        "Account created successfully.",
                        "success"
                    );


                    setLoading(false);


                } catch (error) {

                    console.error(
                        "B&B AI Sign Up Error:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Sign up failed."
                    );

                    setLoading(false);

                }

            }
        );



        /* =====================================================
           CHECK EXISTING SESSION
        ===================================================== */

        async function checkExistingSession() {

            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .getSession();


                if (error) {

                    console.error(
                        "Session check error:",
                        error
                    );

                    return;

                }


                if (
                    data &&
                    data.session
                ) {

                    window.location.replace(
                        "text.html"
                    );

                }

            } catch (error) {

                console.error(
                    "Session check failed:",
                    error
                );

            }

        }


        checkExistingSession();



        /* =====================================================
           AUTH STATE
        ===================================================== */

        supabaseClient.auth.onAuthStateChange(
            (
                event,
                session
            ) => {

                if (
                    (
                        event ===
                        "SIGNED_IN"
                    ) &&
                    session
                ) {

                    window.location.replace(
                        "text.html"
                    );

                }

            }
        );



        /* =====================================================
           THEME
        ===================================================== */

        const savedTheme =
            localStorage.getItem(
                "bbai_theme"
            );


        if (
            savedTheme ===
            "dark"
        ) {

            document.body.classList.add(
                "dark"
            );

            themeButton.textContent =
                "☀";

        }


        themeButton.addEventListener(
            "click",
            () => {

                document.body.classList.toggle(
                    "dark"
                );


                const isDark =
                    document.body.classList.contains(
                        "dark"
                    );


                localStorage.setItem(
                    "bbai_theme",
                    isDark
                        ? "dark"
                        : "light"
                );


                themeButton.textContent =
                    isDark
                        ? "☀"
                        : "☾";

            }
        );

    </script>

</body>
</html>
