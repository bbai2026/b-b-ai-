<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>B&B AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #ffffff;
            --surface: #f7f7f7;
            --surface-2: #eeeeee;
            --text: #111111;
            --muted: #707070;
            --border: #dddddd;
            --button: #111111;
            --button-text: #ffffff;
            --danger: #d93636;
        }

        body.dark {
            --bg: #0b0b0b;
            --surface: #151515;
            --surface-2: #202020;
            --text: #ffffff;
            --muted: #a0a0a0;
            --border: #303030;
            --button: #ffffff;
            --button-text: #000000;
            --danger: #ff5c5c;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        /* =========================
           THEME BUTTON
        ========================= */

        .theme-button {
            position: fixed;
            top: 22px;
            right: 22px;

            width: 42px;
            height: 42px;

            border: 1px solid var(--border);
            border-radius: 50%;

            background: var(--surface);
            color: var(--text);

            cursor: pointer;

            font-size: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: 0.2s;
        }

        .theme-button:hover {
            background: var(--surface-2);
        }

        /* =========================
           AUTH CONTAINER
        ========================= */

        .auth-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .auth-box {
            width: 100%;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: 20px;

            padding: 36px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.06);
        }

        body.dark .auth-box {
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.35);
        }

        /* =========================
           BRAND
        ========================= */

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            width: 64px;
            height: 64px;

            object-fit: contain;

            border-radius: 16px;

            margin-bottom: 14px;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .brand-subtitle {
            margin-top: 7px;

            color: var(--muted);

            font-size: 14px;
        }

        /* =========================
           TABS
        ========================= */

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;

            background: var(--surface-2);

            border-radius: 10px;

            padding: 4px;

            margin-bottom: 24px;
        }

        .tab {
            border: none;
            background: transparent;

            color: var(--muted);

            padding: 10px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;
            font-weight: 600;

            transition: 0.2s;
        }

        .tab.active {
            background: var(--bg);
            color: var(--text);

            box-shadow:
                0 1px 4px rgba(0, 0, 0, 0.08);
        }

        /* =========================
           FORM
        ========================= */

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 600;
        }

        .field input {
            width: 100%;

            height: 46px;

            padding: 0 13px;

            border: 1px solid var(--border);
            border-radius: 9px;

            outline: none;

            background: var(--bg);
            color: var(--text);

            font-size: 14px;

            transition: 0.2s;
        }

        .field input:focus {
            border-color: var(--text);
        }

        /* =========================
           MAIN BUTTON
        ========================= */

        .submit-button {
            width: 100%;

            height: 46px;

            border: none;
            border-radius: 9px;

            background: var(--button);
            color: var(--button-text);

            cursor: pointer;

            font-size: 14px;
            font-weight: 700;

            margin-top: 5px;

            transition: 0.2s;
        }

        .submit-button:hover {
            opacity: 0.86;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            min-height: 20px;

            margin-top: 15px;

            text-align: center;

            font-size: 13px;

            color: var(--danger);
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;

            margin-top: 22px;

            color: var(--muted);

            font-size: 12px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {
            .auth-wrapper {
                padding: 15px;
            }

            .auth-box {
                padding: 26px 20px;
            }

            .theme-button {
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>

<body>

    <button
        class="theme-button"
        id="themeButton"
        type="button"
        aria-label="Change theme">
        ☾
    </button>

    <main class="auth-wrapper">

        <section class="auth-box">

            <!-- BRAND -->

            <div class="brand">

                <img
                    src="logo.jpg"
                    alt="B&B AI"
                    class="brand-logo"
                    onerror="this.style.display='none'">

                <div class="brand-name">
                    B&B AI
                </div>

                <div class="brand-subtitle">
                    Your AI workspace
                </div>

            </div>


            <!-- TABS -->

            <div class="tabs">

                <button
                    class="tab active"
                    id="loginTab"
                    type="button">
                    Login
                </button>

                <button
                    class="tab"
                    id="signupTab"
                    type="button">
                    Sign Up
                </button>

            </div>


            <!-- LOGIN -->

            <form
                class="form active"
                id="loginForm">

                <div class="field">

                    <label for="loginUsername">
                        Username
                    </label>

                    <input
                        id="loginUsername"
                        type="text"
                        autocomplete="username"
                        placeholder="Enter your username"
                        required>

                </div>


                <div class="field">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        id="loginPassword"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required>

                </div>


                <button
                    class="submit-button"
                    type="submit">
                    Login
                </button>

            </form>


            <!-- SIGN UP -->

            <form
                class="form"
                id="signupForm">

                <div class="field">

                    <label for="signupUsername">
                        Username
                    </label>

                    <input
                        id="signupUsername"
                        type="text"
                        autocomplete="username"
                        placeholder="Choose a username"
                        required>

                </div>


                <div class="field">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        id="signupEmail"
                        type="email"
                        autocomplete="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="field">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        id="signupPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Create a password"
                        required>

                </div>


                <div class="field">

                    <label for="signupConfirmPassword">
                        Confirm Password
                    </label>

                    <input
                        id="signupConfirmPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Repeat your password"
                        required>

                </div>


                <button
                    class="submit-button"
                    type="submit">
                    Create Account
                </button>

            </form>


            <div
                class="message"
                id="message">
            </div>


            <div class="footer">
                B&B AI · B&B Studio
            </div>

        </section>

    </main>


    <script>

        /* ==========================================
           CHECK LOGIN
        ========================================== */

        const loggedIn =
            localStorage.getItem("bbai_logged_in");

        if (loggedIn === "true") {

            window.location.replace("text.html");

        }


        /* ==========================================
           ELEMENTS
        ========================================== */

        const loginTab =
            document.getElementById("loginTab");

        const signupTab =
            document.getElementById("signupTab");

        const loginForm =
            document.getElementById("loginForm");

        const signupForm =
            document.getElementById("signupForm");

        const message =
            document.getElementById("message");


        /* ==========================================
           TAB SWITCHING
        ========================================== */

        loginTab.addEventListener("click", () => {

            loginTab.classList.add("active");
            signupTab.classList.remove("active");

            loginForm.classList.add("active");
            signupForm.classList.remove("active");

            message.textContent = "";

        });


        signupTab.addEventListener("click", () => {

            signupTab.classList.add("active");
            loginTab.classList.remove("active");

            signupForm.classList.add("active");
            loginForm.classList.remove("active");

            message.textContent = "";

        });


        /* ==========================================
           SIGN UP
        ========================================== */

        signupForm.addEventListener("submit", (event) => {

            event.preventDefault();

            const username =
                document.getElementById("signupUsername")
                .value
                .trim();

            const email =
                document.getElementById("signupEmail")
                .value
                .trim();

            const password =
                document.getElementById("signupPassword")
                .value;

            const confirmPassword =
                document.getElementById("signupConfirmPassword")
                .value;


            if (password !== confirmPassword) {

                message.textContent =
                    "Passwords do not match.";

                return;

            }


            const user = {

                username: username,
                email: email,
                password: password

            };


            localStorage.setItem(
                "bbai_user",
                JSON.stringify(user)
            );


            localStorage.setItem(
                "bbai_logged_in",
                "true"
            );


            window.location.replace("text.html");

        });


        /* ==========================================
           LOGIN
        ========================================== */

        loginForm.addEventListener("submit", (event) => {

            event.preventDefault();

            const username =
                document.getElementById("loginUsername")
                .value
                .trim();

            const password =
                document.getElementById("loginPassword")
                .value;


            const savedUser =
                localStorage.getItem("bbai_user");


            if (!savedUser) {

                message.textContent =
                    "No account found. Please sign up first.";

                return;

            }


            const user =
                JSON.parse(savedUser);


            if (
                username !== user.username ||
                password !== user.password
            ) {

                message.textContent =
                    "Incorrect username or password.";

                return;

            }


            localStorage.setItem(
                "bbai_logged_in",
                "true"
            );


            window.location.replace("text.html");

        });


        /* ==========================================
           THEME
        ========================================== */

        const themeButton =
            document.getElementById("themeButton");


        const savedTheme =
            localStorage.getItem("bbai_theme");


        if (savedTheme === "dark") {

            document.body.classList.add("dark");

            themeButton.textContent = "☀";

        }


        themeButton.addEventListener("click", () => {

            document.body.classList.toggle("dark");


            const dark =
                document.body.classList.contains("dark");


            localStorage.setItem(
                "bbai_theme",
                dark ? "dark" : "light"
            );


            themeButton.textContent =
                dark ? "☀" : "☾";

        });

    </script>

</body>
</html>
