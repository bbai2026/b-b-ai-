<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#ffffff">

<title>B&B AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="api.js"></script>

<style>

:root {

    --bg: #ffffff;
    --sidebar: #f7f7f9;
    --surface: #ffffff;
    --surface-2: #f1f1f4;
    --text: #111116;
    --muted: #777780;
    --border: #e5e5ea;

    --user-bg: #f0f0f3;

    --accent: #7c5cff;
    --accent-hover: #6948ed;

    --danger: #e5484d;

    --shadow:
        0 12px 35px rgba(0,0,0,.07);

}

html.dark {

    --bg: #09090d;
    --sidebar: #101014;
    --surface: #0d0d12;
    --surface-2: #19191f;
    --text: #f5f5f7;
    --muted: #92929c;
    --border: #292930;

    --user-bg: #1b1b22;

    --accent: #9277ff;
    --accent-hover: #a58dff;

    --danger: #ff6268;

    --shadow:
        0 15px 45px rgba(0,0,0,.3);

}

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: var(--bg);
    color: var(--text);

    overflow: hidden;

}

button,
textarea,
select {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   APP
   ===================================================== */

.app {

    display: flex;

    width: 100%;
    height: 100vh;

    background: var(--bg);

}


/* =====================================================
   SIDEBAR
   ===================================================== */

.sidebar {

    width: 280px;

    flex-shrink: 0;

    display: flex;
    flex-direction: column;

    padding: 14px;

    background: var(--sidebar);

    border-right:
        1px solid var(--border);

}


.brand {

    display: flex;
    align-items: center;

    gap: 10px;

    padding:
        8px 6px 18px;

}


.brand-logo {

    width: 38px;
    height: 38px;

    border-radius: 11px;

    object-fit: cover;

    background:
        var(--surface-2);

}


.brand-name {

    font-size: 16px;
    font-weight: 750;

}


.brand-subtitle {

    margin-top: 2px;

    font-size: 11px;

    color: var(--muted);

}


/* =====================================================
   NEW CHAT
   ===================================================== */

.new-chat {

    width: 100%;

    border:
        1px solid var(--border);

    background:
        var(--surface);

    color:
        var(--text);

    border-radius:
        11px;

    padding:
        11px 13px;

    cursor:
        pointer;

    text-align:
        left;

    transition:
        .15s ease;

}


.new-chat:hover {

    background:
        var(--surface-2);

    transform:
        translateY(-1px);

}


/* =====================================================
   CHAT LIST
   ===================================================== */

.chat-list-title {

    margin:
        22px 7px 8px;

    font-size: 10px;

    color:
        var(--muted);

    text-transform:
        uppercase;

    letter-spacing:
        .08em;

}


.chat-list {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    display: flex;

    flex-direction: column;

    gap: 4px;

}


.chat-item {

    display: flex;

    align-items: center;

    gap: 5px;

    width: 100%;

    padding:
        8px 7px;

    border-radius:
        9px;

    cursor:
        pointer;

    transition:
        .15s ease;

}


.chat-item:hover {

    background:
        var(--surface-2);

}


.chat-item.active {

    background:
        var(--surface-2);

}


.chat-item-title {

    flex: 1;

    min-width: 0;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 13px;

}


.chat-menu {

    width: 27px;
    height: 27px;

    border: none;

    background: transparent;

    color: var(--muted);

    border-radius: 7px;

    cursor: pointer;

    opacity: 0;

}


.chat-item:hover .chat-menu,
.chat-menu:focus {

    opacity: 1;

}


.chat-menu:hover {

    background:
        var(--border);

    color:
        var(--text);

}


/* =====================================================
   SIDEBAR BOTTOM
   ===================================================== */

.sidebar-bottom {

    display: flex;

    flex-direction: column;

    gap: 4px;

    margin-top: 10px;

    padding-top: 10px;

    border-top:
        1px solid var(--border);

}


.sidebar-button {

    width: 100%;

    border:
        1px solid transparent;

    background:
        transparent;

    color:
        var(--text);

    padding:
        9px 10px;

    border-radius:
        9px;

    cursor:
        pointer;

    text-align:
        left;

}


.sidebar-button:hover {

    background:
        var(--surface-2);

}


/* =====================================================
   MAIN
   ===================================================== */

.main {

    flex: 1;

    min-width: 0;

    height: 100vh;

    display: flex;

    flex-direction: column;

}


/* =====================================================
   HEADER
   ===================================================== */

.header {

    height: 64px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    padding:
        0 24px;

    background:
        var(--surface);

    border-bottom:
        1px solid var(--border);

}


.header-title {

    font-size: 15px;

    font-weight: 700;

}


.status {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-top: 2px;

    font-size: 11px;

    color:
        var(--muted);

}


.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background:
        #35b86b;

}


.status-dot.offline {

    background:
        var(--danger);

}


.model-select {

    border:
        1px solid var(--border);

    background:
        var(--surface);

    color:
        var(--text);

    border-radius:
        9px;

    padding:
        8px 10px;

    outline:
        none;

}


/* =====================================================
   CHAT
   ===================================================== */

.chat {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

}


.chat-inner {

    width: 100%;

    max-width: 900px;

    margin:
        0 auto;

    padding:
        30px 24px 160px;

}


/* =====================================================
   WELCOME
   ===================================================== */

.welcome {

    min-height: 55vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

}


.welcome-logo {

    width: 62px;
    height: 62px;

    border-radius:
        18px;

    object-fit:
        cover;

    margin-bottom:
        17px;

}


.welcome h1 {

    margin:
        0;

    font-size:
        30px;

    letter-spacing:
        -.035em;

}


.welcome p {

    margin:
        9px 0 0;

    color:
        var(--muted);

    font-size:
        14px;

}


/* =====================================================
   MESSAGE
   ===================================================== */

.message {

    display: flex;

    width: 100%;

    margin:
        18px 0;

}


.message.user {

    justify-content:
        flex-end;

}


.message.assistant {

    justify-content:
        flex-start;

}


.message-wrapper {

    max-width:
        78%;

}


.message-content {

    font-size:
        15px;

    line-height:
        1.65;

    white-space:
        pre-wrap;

    word-break:
        break-word;

}


.user .message-content {

    background:
        var(--user-bg);

    padding:
        11px 15px;

    border-radius:
        16px;

}


.assistant .message-content {

    padding:
        5px 0;

}


.message-meta {

    margin-bottom:
        5px;

    color:
        var(--muted);

    font-size:
        10px;

}


.message-actions {

    display: flex;

    gap: 4px;

    margin-top:
        5px;

}


.message-action {

    width: 28px;
    height: 28px;

    border:
        1px solid transparent;

    background:
        transparent;

    color:
        var(--muted);

    border-radius:
        7px;

    cursor:
        pointer;

}


.message-action:hover {

    background:
        var(--surface-2);

    color:
        var(--text);

}


.message-action.active {

    color:
        var(--accent);

    background:
        var(--surface-2);

}


/* =====================================================
   THINKING
   ===================================================== */

.thinking {

    display: flex;

    gap:
        5px;

    padding:
        8px 0;

}


.thinking span {

    width: 6px;
    height: 6px;

    border-radius:
        50%;

    background:
        var(--muted);

    animation:
        thinking 1.2s infinite ease-in-out;

}


.thinking span:nth-child(2) {
    animation-delay: .15s;
}


.thinking span:nth-child(3) {
    animation-delay: .3s;
}


@keyframes thinking {

    0%, 80%, 100% {

        opacity: .25;

        transform:
            translateY(0);

    }

    40% {

        opacity: 1;

        transform:
            translateY(-3px);

    }

}


/* =====================================================
   COMPOSER
   ===================================================== */

.composer {

    position: fixed;

    left:
        280px;

    right:
        0;

    bottom:
        0;

    padding:
        18px 24px 22px;

    background:
        linear-gradient(
            to top,
            var(--bg) 68%,
            transparent
        );

    pointer-events:
        none;

}


.composer-inner {

    width:
        100%;

    max-width:
        900px;

    margin:
        0 auto;

    pointer-events:
        auto;

}


.input-box {

    display:
        flex;

    align-items:
        flex-end;

    gap:
        10px;

    padding:
        10px 10px 10px 15px;

    background:
        var(--surface);

    border:
        1px solid var(--border);

    border-radius:
        16px;

    box-shadow:
        var(--shadow);

}


textarea {

    flex:
        1;

    min-height:
        24px;

    max-height:
        180px;

    resize:
        none;

    padding:
        4px 0;

    border:
        none;

    outline:
        none;

    background:
        transparent;

    color:
        var(--text);

    line-height:
        1.5;

    font-size:
        15px;

}


textarea::placeholder {

    color:
        var(--muted);

}


.send-button {

    width:
        38px;

    height:
        38px;

    flex-shrink:
        0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border:
        none;

    border-radius:
        11px;

    background:
        var(--accent);

    color:
        white;

    cursor:
        pointer;

    font-size:
        17px;

}


.send-button:hover {

    background:
        var(--accent-hover);

}


.send-button:disabled {

    opacity:
        .45;

    cursor:
        not-allowed;

}


.composer-note {

    text-align:
        center;

    margin-top:
        8px;

    color:
        var(--muted);

    font-size:
        10px;

}


/* =====================================================
   MODAL
   ===================================================== */

.modal-backdrop {

    position:
        fixed;

    inset:
        0;

    z-index:
        100;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

    background:
        rgba(0,0,0,.45);

    backdrop-filter:
        blur(6px);

}


.modal-backdrop.show {

    display:
        flex;

}


.modal {

    width:
        min(430px, 100%);

    padding:
        22px;

    background:
        var(--surface);

    color:
        var(--text);

    border:
        1px solid var(--border);

    border-radius:
        18px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.25);

}


.modal h2 {

    margin:
        0 0 8px;

    font-size:
        19px;

}


.modal p {

    color:
        var(--muted);

    font-size:
        13px;

    line-height:
        1.6;

}


.modal-input {

    width:
        100%;

    padding:
        11px 12px;

    border:
        1px solid var(--border);

    border-radius:
        10px;

    outline:
        none;

    background:
        var(--surface-2);

    color:
        var(--text);

}


.modal-actions {

    display:
        flex;

    justify-content:
        flex-end;

    gap:
        8px;

    margin-top:
        18px;

}


.modal-button {

    border:
        1px solid var(--border);

    background:
        var(--surface);

    color:
        var(--text);

    padding:
        9px 13px;

    border-radius:
        9px;

    cursor:
        pointer;

}


.modal-button.primary {

    background:
        var(--accent);

    border-color:
        var(--accent);

    color:
        white;

}


.modal-button.danger {

    background:
        var(--danger);

    border-color:
        var(--danger);

    color:
        white;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 800px) {

    .sidebar {
        display: none;
    }

    .composer {
        left: 0;
    }

    .header {
        padding:
            0 15px;
    }

    .chat-inner {
        padding:
            24px 15px 160px;
    }

    .message-wrapper {
        max-width:
            90%;
    }

    .welcome h1 {
        font-size:
            25px;
    }

}

</style>

</head>

</aside>


<main class="main">

<section

                class="welcome-logo"
                alt="B&B AI"
            >

            <h1 data-i18n="welcomeTitle">
                What can I help with?
            </h1>

            <p data-i18n="welcomeSubtitle">
                B&B AI · Created by B&B Studio
            </p>

        </div>

    </div>

</section>


<div class="composer">

    <div class="composer-inner">

        <div class="input-box">

            <textarea
                id="messageInput"
                rows="1"
                data-i18n-placeholder="placeholder"
                placeholder="Message B&B AI..."
            ></textarea>

            <button
                class="send-button"
                id="sendButton"
                title="Send"
            >
                ↑
            </button>

        </div>

        <div
            class="composer-note"
            data-i18n="warning"
        >
            B&B AI can make mistakes. Check important information.
        </div>

    </div>

</div>


</main>

</div>


<!-- =====================================================
     MODAL
     ===================================================== -->

<div
    class="modal-backdrop"
    id="modalBackdrop"
>

    <div class="modal">

        <h2 id="modalTitle"></h2>

        <p id="modalDescription"></p>

        <input
            class="modal-input"
            id="modalInput"
            type="text"
        >

        <div class="modal-actions">

            <button
                class="modal-button"
                id="modalCancel"
            >
                Cancel
            </button>

            <button
                class="modal-button primary"
                id="modalConfirm"
            >
                Save
            </button>

        </div>

    </div>

</div>

/* =====================================================
   LANGUAGE
   ===================================================== */

function t(key) {

    return (
        translations[currentLanguage][key]
        ||
        translations.en[key]
        ||
        key
    );

}


function applyLanguage() {

    const lang =
        translations[currentLanguage]
            ? currentLanguage
            : "en";

    currentLanguage = lang;

    document.documentElement.lang =
        lang;

    document.documentElement.dir =
        lang === "fa"
            ? "rtl"
            : "ltr";


    document
        .querySelectorAll("[data-i18n]")
        .forEach(element => {

            const key =
                element.dataset.i18n;

            element.textContent =
                t(key);

        });


    document
        .querySelectorAll("[data-i18n-placeholder]")
        .forEach(element => {

            const key =
                element.dataset.i18nPlaceholder;

            element.placeholder =
                t(key);

        });


    themeButton.textContent =
        document.documentElement.classList.contains("dark")
            ? t("lightMode")
            : t("darkMode");


    languageButton.textContent =
        t("language");

    aboutButton.textContent =
        t("about");

    renderChatList();

}


function setLanguage(language) {

    if (
        language !== "en" &&
        language !== "fa"
    ) {
        return;
    }

    currentLanguage =
        language;

    localStorage.setItem(
        "bbai_language",
        language
    );

    applyLanguage();

}


/* =====================================================
   THEME
   ===================================================== */

function loadTheme() {

    const saved =
        localStorage.getItem(
            "bbai_theme"
        );

    if (saved === "dark") {

        document.documentElement
            .classList
            .add("dark");

    } else {

        document.documentElement
            .classList
            .remove("dark");

    }

    applyLanguage();

}


function toggleTheme() {

    const isDark =
        document.documentElement
            .classList
            .contains("dark");


    document.documentElement
        .classList
        .toggle("dark");


    localStorage.setItem(
        "bbai_theme",
        isDark
            ? "light"
            : "dark"
    );


    applyLanguage();

}


themeButton.addEventListener(
    "click",
    toggleTheme
);

async function loadSession() {

    try {

        const result =
            await supabaseClient.auth.getSession();

        if (result.error) {

            console.error(
                "Supabase session error:",
                result.error
            );

            currentSession = null;

            return null;
        }

        currentSession =
            result.data.session;

        return currentSession;

    } catch (error) {

        console.error(
            "Session error:",
            error
        );

        currentSession = null;

        return null;
    }

}


/* =====================================================
   AUTH HEADERS
   ===================================================== */

function getAuthHeaders() {

    const headers = {

        "Content-Type":
            "application/json"

    };

    if (
        currentSession &&
        currentSession.access_token
    ) {

        headers["Authorization"] =
            `Bearer ${currentSession.access_token}`;

    }

    return headers;

}

async function checkAPI() {

    try {

        const response =
            await fetch(
                `${API_BASE}/api/status`,

                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

            data.ollama === true;

        statusDot.classList.add(

        );

/* =====================================================
   CREATE MESSAGE
   ===================================================== */

function addMessage(
    role,
    content,
    modelName = null
) {

    const welcome =
        document.getElementById(
            "welcome"
        );

    if (welcome) {
        welcome.remove();
    }


    const message =
        document.createElement("div");

    message.className =
        `message ${role}`;


    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message-wrapper";


    const meta =
        document.createElement("div");

    meta.className =
        "message-meta";


    meta.textContent =
        role === "user"
            ? t("you")
            : (
                modelName ||
                modelSelect.value
            );


    const text =
        document.createElement("div");

    text.className =
        "message-content";

    text.textContent =
        content;


    wrapper.appendChild(meta);

    wrapper.appendChild(text);


    if (role === "assistant") {

        const actions =
            document.createElement("div");

        actions.className =
            "message-actions";


        const like =
            document.createElement("button");

        like.className =
            "message-action";

        like.textContent =
            "👍";

        like.title =
            t("liked");


        const dislike =
            document.createElement("button");

        dislike.className =
            "message-action";

        dislike.textContent =
            "👎";

        dislike.title =
            t("disliked");


        const copy =
            document.createElement("button");

        copy.className =
            "message-action";

        copy.textContent =
            "⧉";

        copy.title =
            t("copy");


        like.addEventListener(
            "click",
            () => {

                like.classList.toggle(
                    "active"
                );

                dislike.classList.remove(
                    "active"
                );

            }
        );


        dislike.addEventListener(
            "click",
            () => {

                dislike.classList.toggle(
                    "active"
                );

                like.classList.remove(
                    "active"
                );

            }
        );


        copy.addEventListener(
            "click",
            async () => {

                try {

                    await navigator.clipboard.writeText(
                        content
                    );

                    copy.textContent =
                        "✓";

                    setTimeout(
                        () => {
                            copy.textContent =
                                "⧉";
                        },
                        1000
                    );

                } catch (error) {

                    console.error(
                        "Copy error:",
                        error
                    );

                }

            }
        );


        actions.appendChild(like);
        actions.appendChild(dislike);
        actions.appendChild(copy);

        wrapper.appendChild(actions);

    }


    message.appendChild(wrapper);

    chatInner.appendChild(message);

    scrollToBottom();

    return message;

}

/* =====================================================
   CREATE CONVERSATION
   ===================================================== */

async function createConversation() {

    if (!currentSession) {

        throw new Error(
            "Please log in first."
        );

    }


    const response =
        await fetch(
            `${API_BASE}/v1/conversations`,
            {
                method: "POST",
                headers:
                    getAuthHeaders(),
                body:
                    JSON.stringify({
                        title:
                            currentLanguage === "fa"
                                ? "چت جدید"
                                : "New Chat",
                        model:
                            modelSelect.value
                    })
            }
        );


    const data =
        await response.json();


    if (
        !response.ok ||
        !data.success ||
        !data.conversation
    ) {

        throw new Error(
            data.error ||
            "Could not create conversation."
        );

    }


    currentConversationId =
        data.conversation.id;


    conversations.unshift(
        data.conversation
    );


    renderChatList();


    return currentConversationId;

}


/* =====================================================
   SAVE MESSAGE
   ===================================================== */

async function saveMessage(
    role,
    content,
    model = null
) {

    if (!currentSession) {

        throw new Error(
            "Please log in first."
        );

    }


    if (!currentConversationId) {

        await createConversation();

    }


    const response =
        await fetch(

            `${API_BASE}` +
            `/v1/conversations/` +
            `${currentConversationId}` +
            `/messages`,

            {
                method: "POST",

                headers:
                    getAuthHeaders(),

                body:
                    JSON.stringify({

                        role:
                            role,

                        content:
                            content,

                        model:
                            model ||
                            modelSelect.value

                    })

            }

        );


    const data =
        await response.json();


    if (
        !response.ok ||
        !data.success
    ) {

        throw new Error(
            data.error ||
            "Could not save message."
        );

    }


    return data.message;

}


/* =====================================================
   LOAD CONVERSATIONS
   ===================================================== */

async function loadConversations() {

    if (!currentSession) {
        return [];
    }


    const response =
        await fetch(
            `${API_BASE}/v1/conversations`,
            {
                method: "GET",
                headers:
                    getAuthHeaders(),
                cache:
                    "no-store"
            }
        );


    const data =
        await response.json();


    if (
        !response.ok ||
        !data.success
    ) {

        throw new Error(
            data.error ||
            "Could not load conversations."
        );

    }


    conversations =
        data.conversations || [];


    renderChatList();


    return conversations;

}


/* =====================================================
   RENDER CHAT LIST
   ===================================================== */

function renderChatList() {

    chatList.innerHTML = "";


    if (!conversations.length) {

        return;

    }


    for (const conversation of conversations) {

        const item =
            document.createElement("div");

        item.className =
            "chat-item" +
            (
                conversation.id ===
                currentConversationId
                    ? " active"
                    : ""
            );


        const title =
            document.createElement("div");

        title.className =
            "chat-item-title";

        title.textContent =
            conversation.title ||
            (
                currentLanguage === "fa"
                    ? "چت جدید"
                    : "New Chat"
            );


        const menu =
            document.createElement("button");

        menu.className =
            "chat-menu";

        menu.textContent =
            "⋯";

        menu.title =
            "Menu";


        item.addEventListener(
            "click",
            () => {

                loadConversation(
                    conversation.id
                );

            }
        );


        menu.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                showChatMenu(
                    conversation
                );

            }
        );


        item.appendChild(title);

        item.appendChild(menu);

        chatList.appendChild(item);

    }

}

/* =====================================================
   LOAD MESSAGES
   ===================================================== */

async function loadMessages(
    conversationId
) {

    const response =
        await fetch(

            `${API_BASE}` +
            `/v1/conversations/` +
            `${conversationId}` +
            `/messages`,

            {
                method: "GET",
                headers:
                    getAuthHeaders(),
                cache:
                    "no-store"
            }

        );


    const data =
        await response.json();


    if (
        !response.ok ||
        !data.success
    ) {

        throw new Error(
            data.error ||
            "Could not load messages."
        );

    }


    return data.messages || [];

}


/* =====================================================
   LOAD CONVERSATION
   ===================================================== */

async function loadConversation(
    conversationId
) {

    if (isSending) {
        return;
    }


    const conversation =
        conversations.find(
            item =>
                item.id === conversationId
        );


    if (!conversation) {
        return;
    }


    currentConversationId =
        conversationId;


    if (
        [
            "B&B AI",
            "B&B AI Lite",
            "B&B AI Pro",
            "B&B AI Deep"
        ].includes(
            conversation.model
        )
    ) {

        modelSelect.value =
            conversation.model;

    }


    renderChatList();


    try {

        const messages =
            await loadMessages(
                conversationId
            );


        displayMessages(
            messages
        );

    } catch (error) {

        console.error(
            "Load conversation error:",
            error
        );

    }

}


/* =====================================================
   DISPLAY MESSAGES
   ===================================================== */

function displayMessages(messages) {

    chatInner.innerHTML = "";


    if (!messages.length) {

        showWelcome();

        history = [];

        return;

    }


    history =
        messages.map(
            message => ({
                role:
                    message.role,
                content:
                    message.content
            })
        );


    for (const message of messages) {

        addMessage(
            message.role,
            message.content,
            message.model
        );

    }


    scrollToBottom();

}

}


/* =====================================================
   RENAME
   ===================================================== */

function openRenameModal(
    conversation
) {

    modalAction = async () => {

        const title =
            modalInput.value.trim();


        if (!title) {
            return;
        }


        try {

            const response =
                await fetch(

                    `${API_BASE}` +
                    `/v1/conversations/` +
                    `${conversation.id}`,

                    {
                        method: "PATCH",

                        headers:
                            getAuthHeaders(),

                        body:
                            JSON.stringify({
                                title
                            })
                    }

                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.error ||
                    "Rename failed."
                );

            }


            const index =
                conversations.findIndex(
                    item =>
                        item.id ===
                        conversation.id
                );


            if (index !== -1) {

                conversations[index] =
                    data.conversation;

            }


            closeModal();

            renderChatList();

        } catch (error) {

            console.error(
                "Rename error:",
                error
            );

            alert(
                error.message
            );

        }

    };


    modalTitle.textContent =
        t("renameTitle");

    modalDescription.textContent =
        t("renameDescription");

    modalInput.value =
        conversation.title || "";

    modalInput.placeholder =
        currentLanguage === "fa"
            ? "نام چت"
            : "Chat name";

    modalConfirm.textContent =
        t("save");

    modalCancel.textContent =
        t("cancel");

    modalConfirm.className =
        "modal-button primary";

    modalBackdrop.classList.add(
        "show"
    );

    modalInput.focus();

}


/* =====================================================
   DELETE
   ===================================================== */

function openDeleteModal(
    conversation
) {

    modalAction = async () => {

        try {

            const response =
                await fetch(

                    `${API_BASE}` +
                    `/v1/conversations/` +
                    `${conversation.id}`,

                    {
                        method:
                            "DELETE",

                        headers:
                            getAuthHeaders()
                    }

                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.error ||
                    "Delete failed."
                );

            }


            conversations =
                conversations.filter(
                    item =>
                        item.id !==
                        conversation.id
                );


            if (
                currentConversationId ===
                conversation.id
            ) {

                currentConversationId =
                    null;

                history = [];

                showWelcome();

            }


            closeModal();

            renderChatList();

        } catch (error) {

            console.error(
                "Delete error:",
                error
            );

            alert(
                error.message
            );

        }

    };


    modalTitle.textContent =
        t("deleteTitle");

    modalDescription.textContent =
        t("deleteDescription");

    modalInput.style.display =
        "none";

    modalConfirm.textContent =
        t("deleteConfirm");

    modalCancel.textContent =
        t("cancel");

    modalConfirm.className =
        "modal-button danger";

    modalBackdrop.classList.add(
        "show"
    );

}

/* =====================================================
   SEND
   ===================================================== */

async function sendMessage() {

    if (isSending) {
        return;
    }


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    isSending = true;

    sendButton.disabled =
        true;


    const selectedModel =
        modelSelect.value;


    let thinking = null;


    try {

        if (!currentSession) {

            await loadSession();

        }


        if (!currentSession) {

            throw new Error(
                "Please log in first."
            );

        }


        if (!currentConversationId) {

            await createConversation();

        }


        addMessage(
            "user",
            message
        );


        input.value = "";

        resizeTextarea();


        /*
         * Add current user message to
         * AI history BEFORE sending.
         */

        const aiHistory =
            [
                ...history,
                {
                    role:
                        "user",
                    content:
                        message
                }
            ];


        /*
         * Save user message.
         */

        try {

            await saveMessage(
                "user",
                message,
                selectedModel
            );

        } catch (saveError) {

            console.error(
                "User message save error:",
                saveError
            );

        }


        thinking =
            addThinking();


        const response =
            await fetch(

                `${API_BASE}` +
                `${CHAT_ENDPOINT}`,

                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            model:
                                selectedModel,

                            history:
                                aiHistory

                        })

                }

            );


        let data = null;


        try {

            data =
                await response.json();

        } catch {

            throw new Error(
                `Invalid API response (${response.status})`
            );

        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                `AI request failed (${response.status})`
            );

        }


        if (thinking) {

            thinking.remove();

            thinking = null;

        }


        const reply =
            data.reply ||
            "No response received.";


        addMessage(
            "assistant",
            reply,
            data.name ||
            selectedModel
        );


        try {

            await saveMessage(
                "assistant",
                reply,
                selectedModel
            );

        } catch (saveError) {

            console.error(
                "Assistant save error:",
                saveError
            );

        }


        history.push({
            role:
                "user",
            content:
                message
        });


        history.push({
            role:
                "assistant",
            content:
                reply
        });


        /*
         * Refresh sidebar ordering.
         */

        await loadConversations();


    } catch (error) {

        console.error(
            "Send error:",
            error
        );


        if (thinking) {
            thinking.remove();
        }


        addMessage(
            "assistant",
            `⚠️ ${t("error")}: ${error.message}`
        );

    } finally {

        isSending = false;

        sendButton.disabled =
            false;

        input.focus();

    }

}

    sendMessage
);


/* =====================================================
   ENTER
   ===================================================== */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   TEXTAREA
   ===================================================== */

function resizeTextarea() {

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            180
        ) + "px";

}


input.addEventListener(
    "input",
    resizeTextarea
);


/* =====================================================
   AUTH STATE
   ===================================================== */

supabaseClient.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        currentSession =
            session;


        if (
            event === "SIGNED_IN"
        ) {

            await loadLastConversation();

        }


        if (
            event === "SIGNED_OUT"
        ) {

            currentSession =
                null;

            currentConversationId =
                null;

            history = [];

            conversations = [];

            renderChatList();

            showWelcome();

        }

    }
);


/* =====================================================
   START
   ===================================================== */

async function start() {

    loadTheme();

    applyLanguage();

    resizeTextarea();

    await loadSession();

    await checkAPI();


    if (currentSession) {

        await loadLastConversation();

    } else {

        showWelcome();

    }


    input.focus();

}


start();

</script>
