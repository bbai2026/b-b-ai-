<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>B&B AI</title>

    <script src="api.js"></script>

    <style>
        :root {
            --bg: #ffffff;
            --sidebar: #f7f7f8;
            --surface: #ffffff;
            --surface-2: #eeeeef;
            --text: #111111;
            --muted: #707070;
            --border: #dddddd;
            --button: #111111;
            --button-text: #ffffff;
            --accent: #8b5cf6;
            --success: #16803c;
            --danger: #d33;
            --user-message: #f0f0f0;
        }

        body.dark {
            --bg: #09090b;
            --sidebar: #111114;
            --surface: #151518;
            --surface-2: #202024;
            --text: #ffffff;
            --muted: #a1a1aa;
            --border: #2d2d32;
            --button: #ffffff;
            --button-text: #111111;
            --accent: #a78bfa;
            --success: #4ade80;
            --danger: #ff6b6b;
            --user-message: #242428;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--bg);
            color: var(--text);

            height: 100vh;
            overflow: hidden;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }

        button,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           APP
        ===================================================== */

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            width: 250px;
            flex-shrink: 0;

            background: var(--sidebar);
            border-right: 1px solid var(--border);

            display: flex;
            flex-direction: column;

            padding: 16px;

            transition:
                width 0.25s ease,
                transform 0.25s ease;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 18px;
            font-weight: 700;
        }

        .brand img {
            width: 34px;
            height: 34px;

            object-fit: contain;

            border-radius: 8px;
        }

        .new-chat-btn {
            width: 100%;
            height: 42px;

            border: 1px solid var(--border);
            border-radius: 9px;

            background: var(--surface);
            color: var(--text);

            font-weight: 600;

            margin-bottom: 18px;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .new-chat-btn:hover {
            background: var(--surface-2);
        }

        .nav-title {
            font-size: 11px;
            font-weight: 700;

            color: var(--muted);

            text-transform: uppercase;
            letter-spacing: 0.7px;

            margin-bottom: 8px;
        }

        .nav-item {
            width: 100%;
            height: 42px;

            display: flex;
            align-items: center;

            gap: 11px;

            padding: 0 12px;

            border: none;
            border-radius: 9px;

            background: transparent;
            color: var(--muted);

            text-align: left;

            margin-bottom: 4px;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .nav-item:hover {
            background: var(--surface-2);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--surface-2);
            color: var(--text);
            font-weight: 600;
        }

        .nav-icon {
            width: 20px;
            text-align: center;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .status-box {
            padding: 11px 12px;

            border: 1px solid var(--border);
            border-radius: 10px;

            background: var(--surface);

            margin-bottom: 10px;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: var(--danger);

            flex-shrink: 0;
        }

        .status-dot.online {
            background: var(--success);
        }

        .status-text {
            color: var(--muted);
        }

        .theme-btn {
            width: 100%;
            height: 42px;

            border: 1px solid var(--border);
            border-radius: 9px;

            background: var(--surface);
            color: var(--text);

            font-weight: 600;
        }

        .theme-btn:hover {
            background: var(--surface-2);
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            flex: 1;

            min-width: 0;

            display: flex;
            flex-direction: column;

            background: var(--bg);
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .topbar {
            height: 64px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;

            border-bottom: 1px solid var(--border);

            background: var(--bg);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mobile-menu {
            display: none;

            width: 38px;
            height: 38px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--surface);
            color: var(--text);
        }

        .page-title {
            font-size: 17px;
            font-weight: 700;
        }

        .model-select {
            height: 38px;

            padding: 0 12px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: var(--surface);
            color: var(--text);

            outline: none;

            cursor: pointer;
        }

        /* =====================================================
           CHAT
        ===================================================== */

        .chat {
            flex: 1;

            overflow-y: auto;

            padding: 30px 20px 150px;
        }

        .chat-inner {
            width: 100%;
            max-width: 850px;

            margin: 0 auto;
        }

        .welcome {
            min-height: 55vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 20px;
        }

        .welcome-logo {
            width: 70px;
            height: 70px;

            object-fit: contain;

            border-radius: 16px;

            margin-bottom: 20px;
        }

        .welcome h1 {
            font-size: 30px;

            margin-bottom: 10px;

            letter-spacing: -0.7px;
        }

        .welcome p {
            color: var(--muted);

            font-size: 15px;

            max-width: 500px;

            line-height: 1.6;
        }

        .message-row {
            display: flex;

            width: 100%;

            margin-bottom: 24px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message {
            max-width: 78%;

            padding: 12px 15px;

            border-radius: 13px;

            font-size: 15px;

            line-height: 1.65;

            white-space: pre-wrap;

            word-break: break-word;
        }

        .message.user {
            background: var(--user-message);
            color: var(--text);

            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: transparent;

            color: var(--text);

            padding-left: 0;
            padding-right: 0;

            max-width: 90%;
        }

        .assistant-label {
            font-size: 12px;
            font-weight: 700;

            color: var(--accent);

            margin-bottom: 5px;
        }

        .typing {
            color: var(--muted);

            font-size: 14px;

            animation: typingPulse 1.2s infinite;
        }

        @keyframes typingPulse {
            0%,
            100% {
                opacity: 0.45;
            }

            50% {
                opacity: 1;
            }
        }

        /* =====================================================
           INPUT
        ===================================================== */

        .input-area {
            position: fixed;

            left: 250px;
            right: 0;
            bottom: 0;

            padding: 18px 20px 22px;

            background:
                linear-gradient(
                    to top,
                    var(--bg) 70%,
                    transparent
                );
        }

        .input-inner {
            width: 100%;
            max-width: 850px;

            margin: 0 auto;
        }

        .input-box {
            display: flex;
            align-items: flex-end;

            gap: 10px;

            padding: 10px;

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 14px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.06);
        }

        body.dark .input-box {
            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.25);
        }

        textarea {
            flex: 1;

            resize: none;

            min-height: 24px;
            max-height: 150px;

            border: none;
            outline: none;

            background: transparent;

            color: var(--text);

            padding: 5px 6px;

            line-height: 1.5;
        }

        textarea::placeholder {
            color: var(--muted);
        }

        .send-btn {
            width: 40px;
            height: 40px;

            flex-shrink: 0;

            border: none;
            border-radius: 9px;

            background: var(--button);
            color: var(--button-text);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 17px;
            font-weight: 700;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .send-btn:hover {
            opacity: 0.85;
        }

        .send-btn:active {
            transform: scale(0.96);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .input-note {
            text-align: center;

            color: var(--muted);

            font-size: 10px;

            margin-top: 8px;
        }

        /* =====================================================
           ERROR
        ===================================================== */

        .error-box {
            margin: 10px 0;

            padding: 12px 14px;

            border: 1px solid rgba(211, 51, 51, 0.3);

            border-radius: 9px;

            background: rgba(211, 51, 51, 0.08);

            color: var(--danger);

            font-size: 13px;

            line-height: 1.5;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 750px) {

            .sidebar {
                position: fixed;

                z-index: 100;

                top: 0;
                left: 0;
                bottom: 0;

                transform: translateX(-100%);

                box-shadow:
                    10px 0 30px rgba(0, 0, 0, 0.15);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-menu {
                display: block;
            }

            .input-area {
                left: 0;
            }

            .topbar {
                padding: 0 14px;
            }

            .chat {
                padding-left: 14px;
                padding-right: 14px;
            }

            .message {
                max-width: 90%;
            }

            .model-select {
                max-width: 150px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
    ===================================================== -->

    <aside class="sidebar" id="sidebar">

        <div>

            <div class="sidebar-top">

                <div class="brand">

                    <img
                        src="logo.jpg"
                        alt="B&B AI"
                    >

                    <span>B&B AI</span>

                </div>

            </div>


            <button
                class="new-chat-btn"
                id="newChatBtn"
                type="button"
            >
                + New Chat
            </button>


            <div class="nav-title">
                Modes
            </div>


            <button
                class="nav-item active"
                type="button"
            >

                <span class="nav-icon">
                    💬
                </span>

                <span>
                    Chat / Text
                </span>

            </button>


            <button
                class="nav-item"
                type="button"
                disabled
            >

                <span class="nav-icon">
                    🖼️
                </span>

                <span>
                    Image
                </span>

            </button>


            <button
                class="nav-item"
                type="button"
                disabled
            >

                <span class="nav-icon">
                    🎬
                </span>

                <span>
                    Video
                </span>

            </button>


            <button
                class="nav-item"
                type="button"
                disabled
            >

                <span class="nav-icon">
                    🎵
                </span>

                <span>
                    Music
                </span>

            </button>


            <button
                class="nav-item"
                type="button"
                disabled
            >

                <span class="nav-icon">
                    🧊
                </span>

                <span>
                    3D
                </span>

            </button>

        </div>


        <div class="sidebar-bottom">

            <div
                class="status-box"
                id="statusBox"
            >

                <div class="status-row">

                    <span
                        class="status-dot"
                        id="statusDot"
                    ></span>

                    <span
                        class="status-text"
                        id="statusText"
                    >
                        Checking API...
                    </span>

                </div>

            </div>


            <button
                class="theme-btn"
                id="themeBtn"
                type="button"
            >
                ☾ Dark Mode
            </button>

        </div>

    </aside>


    <!-- =====================================================
         MAIN
    ===================================================== -->

    <section class="main">

        <header class="topbar">

            <div class="topbar-left">

                <button
                    class="mobile-menu"
                    id="mobileMenu"
                    type="button"
                >
                    ☰
                </button>

                <span class="page-title">
                    B&B AI
                </span>

            </div>


            <select
                class="model-select"
                id="modelSelect"
            >

                <option value="B&B AI">
                    B&B AI
                </option>

                <option value="B&B AI Lite">
                    B&B AI Lite
                </option>

                <option value="B&B AI Pro">
                    B&B AI Pro
                </option>

                <option value="B&B AI Deep">
                    B&B AI Deep
                </option>

            </select>

        </header>


        <!-- =================================================
             CHAT
        ================================================= -->

        <div
            class="chat"
            id="chat"
        >

            <div
                class="chat-inner"
                id="chatInner"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <img
                        class="welcome-logo"
                        src="logo.jpg"
                        alt="B&B AI"
                    >

                    <h1>
                        B&B AI
                    </h1>

                    <p>
                        Your AI assistant, created by B&B Studio.
                    </p>

                </div>

            </div>

        </div>

    </section>

</div>


<!-- =====================================================
     INPUT
===================================================== -->

<div class="input-area">

    <div class="input-inner">

        <div class="input-box">

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Message B&B AI..."
            ></textarea>


            <button
                class="send-btn"
                id="sendBtn"
                type="button"
                aria-label="Send"
            >
                ↑
            </button>

        </div>


        <div class="input-note">
            B&B AI • Created by B&B Studio
        </div>

    </div>

</div>


<script>

    /* =====================================================
       CONFIG
    ===================================================== */

    const API_BASE =
        String(
            BBAI_CONFIG.ai.baseUrl
        ).replace(/\/+$/, "");

    const CHAT_ENDPOINT =
        BBAI_CONFIG.ai.endpoints.chat;


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const sidebar =
        document.getElementById("sidebar");

    const mobileMenu =
        document.getElementById("mobileMenu");

    const themeBtn =
        document.getElementById("themeBtn");

    const newChatBtn =
        document.getElementById("newChatBtn");

    const modelSelect =
        document.getElementById("modelSelect");

    const chat =
        document.getElementById("chat");

    const chatInner =
        document.getElementById("chatInner");

    const welcome =
        document.getElementById("welcome");

    const messageInput =
        document.getElementById("messageInput");

    const sendBtn =
        document.getElementById("sendBtn");

    const statusDot =
        document.getElementById("statusDot");

    const statusText =
        document.getElementById("statusText");


    /* =====================================================
       CHAT HISTORY
    ===================================================== */

    let history = [];

    let sending = false;


    /* =====================================================
       THEME
    ===================================================== */

    function applyTheme(theme) {

        if (theme === "dark") {

            document.body.classList.add("dark");

            themeBtn.textContent =
                "☀ Light Mode";

        } else {

            document.body.classList.remove("dark");

            themeBtn.textContent =
                "☾ Dark Mode";
        }
    }


    const savedTheme =
        localStorage.getItem("bbai-theme") ||
        "light";

    applyTheme(savedTheme);


    themeBtn.addEventListener(
        "click",
        () => {

            const dark =
                document.body.classList.toggle("dark");

            const theme =
                dark ? "dark" : "light";

            localStorage.setItem(
                "bbai-theme",
                theme
            );

            themeBtn.textContent =
                dark
                    ? "☀ Light Mode"
                    : "☾ Dark Mode";

        }
    );


    /* =====================================================
       MOBILE SIDEBAR
    ===================================================== */

    mobileMenu.addEventListener(
        "click",
        () => {

            sidebar.classList.toggle("open");

        }
    );


    /* =====================================================
       NEW CHAT
    ===================================================== */

    newChatBtn.addEventListener(
        "click",
        () => {

            history = [];

            chatInner.innerHTML = "";

            const newWelcome =
                document.createElement("div");

            newWelcome.className =
                "welcome";

            newWelcome.innerHTML = `
                <img
                    class="welcome-logo"
                    src="logo.jpg"
                    alt="B&B AI"
                >

                <h1>
                    B&B AI
                </h1>

                <p>
                    Your AI assistant, created by B&B Studio.
                </p>
            `;

            chatInner.appendChild(
                newWelcome
            );

            messageInput.focus();

            sidebar.classList.remove("open");

        }
    );


    /* =====================================================
       ADD USER MESSAGE
    ===================================================== */

    function addUserMessage(text) {

        const row =
            document.createElement("div");

        row.className =
            "message-row user";

        const message =
            document.createElement("div");

        message.className =
            "message user";

        message.textContent =
            text;

        row.appendChild(message);

        chatInner.appendChild(row);

        scrollToBottom();
    }


    /* =====================================================
       ADD ASSISTANT MESSAGE
    ===================================================== */

    function addAssistantMessage(
        name,
        text
    ) {

        const row =
            document.createElement("div");

        row.className =
            "message-row";

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message assistant";

        const label =
            document.createElement("div");

        label.className =
            "assistant-label";

        label.textContent =
            name || "B&B AI";

        const content =
            document.createElement("div");

        content.textContent =
            text;

        wrapper.appendChild(label);
        wrapper.appendChild(content);

        row.appendChild(wrapper);

        chatInner.appendChild(row);

        scrollToBottom();

        return content;
    }


    /* =====================================================
       TYPING MESSAGE
    ===================================================== */

    function addTypingMessage() {

        const row =
            document.createElement("div");

        row.className =
            "message-row";

        row.id =
            "typingRow";

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message assistant";

        const label =
            document.createElement("div");

        label.className =
            "assistant-label";

        label.textContent =
            modelSelect.value;

        const typing =
            document.createElement("div");

        typing.className =
            "typing";

        typing.textContent =
            "Thinking...";

        wrapper.appendChild(label);
        wrapper.appendChild(typing);

        row.appendChild(wrapper);

        chatInner.appendChild(row);

        scrollToBottom();
    }


    /* =====================================================
       REMOVE TYPING
    ===================================================== */

    function removeTypingMessage() {

        const typingRow =
            document.getElementById(
                "typingRow"
            );

        if (typingRow) {
            typingRow.remove();
        }
    }


    /* =====================================================
       ERROR MESSAGE
    ===================================================== */

    function addErrorMessage(text) {

        const row =
            document.createElement("div");

        row.className =
            "message-row";

        const box =
            document.createElement("div");

        box.className =
            "error-box";

        box.textContent =
            text;

        row.appendChild(box);

        chatInner.appendChild(row);

        scrollToBottom();
    }


    /* =====================================================
       SCROLL
    ===================================================== */

    function scrollToBottom() {

        requestAnimationFrame(() => {

            chat.scrollTop =
                chat.scrollHeight;

        });
    }


    /* =====================================================
       API STATUS
    ===================================================== */

    async function checkAPI() {

        statusText.textContent =
            "Checking API...";

        statusDot.classList.remove(
            "online"
        );

        try {

            const response =
                await fetch(
                    `${API_BASE}/api/status`,
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            console.log(
                "B&B AI API status:",
                data
            );


            if (
                data &&
                data.success === true &&
                data.ollama === true
            ) {

                statusDot.classList.add(
                    "online"
                );

                statusText.textContent =
                    "API Online";

            } else {

                throw new Error(
                    "API returned an invalid status."
                );

            }

        }

        catch (error) {

            console.error(
                "API status check failed:",
                error
            );

            statusDot.classList.remove(
                "online"
            );

            statusText.textContent =
                "API Offline";
        }
    }


    /* =====================================================
       SEND MESSAGE
    ===================================================== */

    async function sendMessage() {

        if (sending) {
            return;
        }


        const message =
            messageInput.value.trim();


        if (!message) {
            return;
        }


        sending = true;

        sendBtn.disabled = true;


        if (welcome) {
            welcome.remove();
        }


        addUserMessage(
            message
        );


        const selectedModel =
            modelSelect.value;


        const previousHistory =
            [...history];


        history.push({
            role: "user",
            content: message
        });


        messageInput.value = "";

        resizeTextarea();


        addTypingMessage();


        try {

            const response =
                await fetch(
                    `${API_BASE}${CHAT_ENDPOINT}`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            message:
                                message,

                            model:
                                selectedModel,

                            history:
                                previousHistory

                        }),

                        cache: "no-store"
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    `HTTP ${response.status}`
                );

            }


            if (
                !data ||
                data.success !== true
            ) {

                throw new Error(
                    data?.error ||
                    "The API returned an invalid response."
                );

            }


            removeTypingMessage();


            const reply =
                String(
                    data.reply ||
                    ""
                ).trim();


            if (!reply) {

                throw new Error(
                    "B&B AI returned an empty response."
                );

            }


            addAssistantMessage(
                data.name ||
                selectedModel,

                reply
            );


            history.push({
                role: "assistant",
                content: reply
            });


        }

        catch (error) {

            removeTypingMessage();


            /*
               Remove the user message from
               conversation history if the
               request failed.
            */

            history = previousHistory;


            console.error(
                "B&B AI request failed:",
                error
            );


            addErrorMessage(
                `Could not connect to B&B AI. ${error.message}`
            );

        }

        finally {

            sending = false;

            sendBtn.disabled = false;

            messageInput.focus();

        }
    }


    /* =====================================================
       SEND BUTTON
    ===================================================== */

    sendBtn.addEventListener(
        "click",
        sendMessage
    );


    /* =====================================================
       ENTER TO SEND
    ===================================================== */

    messageInput.addEventListener(
        "keydown",
        (event) => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* =====================================================
       AUTO RESIZE TEXTAREA
    ===================================================== */

    function resizeTextarea() {

        messageInput.style.height =
            "auto";

        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                150
            ) + "px";
    }


    messageInput.addEventListener(
        "input",
        resizeTextarea
    );


    /* =====================================================
       START
    ===================================================== */

    checkAPI();

    setInterval(
        checkAPI,
        30000
    );

    messageInput.focus();

</script>

</body>
</html>
