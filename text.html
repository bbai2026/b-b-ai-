<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>B&B AI</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- B&B AI API CONFIG -->
    <script src="api.js"></script>

    <style>

        /* =====================================================
           B&B AI - TEXT
        ===================================================== */

        :root {

            --bg: #ffffff;
            --sidebar: #f7f7f8;
            --surface: #ffffff;
            --surface-2: #f3f3f3;
            --text: #111111;
            --muted: #777777;
            --border: #e5e5e5;
            --user-bg: #f1f1f1;
            --assistant-bg: transparent;

            --accent: #7c5cff;
            --accent-hover: #6948ed;

            --danger: #e5484d;

            --shadow:
                0 8px 30px rgba(0, 0, 0, 0.06);
        }


        html.dark {

            --bg: #0b0b0f;
            --sidebar: #101014;
            --surface: #0b0b0f;
            --surface-2: #18181d;
            --text: #f5f5f5;
            --muted: #929292;
            --border: #29292f;
            --user-bg: #1b1b21;
            --assistant-bg: transparent;

            --accent: #9277ff;
            --accent-hover: #a58dff;

            --shadow:
                0 8px 30px rgba(0, 0, 0, 0.25);
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--bg);
            color: var(--text);

            overflow: hidden;
        }


        button,
        textarea,
        select {
            font: inherit;
        }


        /* =====================================================
           APP
        ===================================================== */

        .app {

            display: flex;

            width: 100%;
            height: 100vh;

            background: var(--bg);
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {

            width: 260px;

            background: var(--sidebar);

            border-right:
                1px solid var(--border);

            display: flex;
            flex-direction: column;

            padding: 16px;

            transition:
                width 0.2s ease;
        }


        .brand {

            display: flex;
            align-items: center;

            gap: 10px;

            padding:
                8px 6px 20px;
        }


        .brand-logo {

            width: 34px;
            height: 34px;

            border-radius: 10px;

            object-fit: cover;

            background:
                var(--surface-2);
        }


        .brand-name {

            font-size: 16px;
            font-weight: 700;
        }


        .brand-subtitle {

            font-size: 11px;

            color:
                var(--muted);

            margin-top: 2px;
        }


        /* =====================================================
           NEW CHAT
        ===================================================== */

        .new-chat {

            width: 100%;

            border:
                1px solid var(--border);

            background:
                var(--surface);

            color:
                var(--text);

            border-radius: 10px;

            padding:
                11px 13px;

            cursor: pointer;

            text-align: left;

            transition:
                0.15s ease;
        }


        .new-chat:hover {

            background:
                var(--surface-2);
        }


        /* =====================================================
           NAV
        ===================================================== */

        .nav {

            margin-top: 20px;
        }


        .nav-title {

            font-size: 11px;

            color:
                var(--muted);

            padding:
                0 7px 8px;

            text-transform:
                uppercase;

            letter-spacing:
                0.06em;
        }


        .nav-item {

            display: flex;
            align-items: center;

            gap: 10px;

            width: 100%;

            padding:
                10px 9px;

            border-radius: 9px;

            color:
                var(--text);

            text-decoration: none;

            font-size: 14px;

            background:
                transparent;
        }


        .nav-item.active {

            background:
                var(--surface-2);
        }


        /* =====================================================
           SIDEBAR BOTTOM
        ===================================================== */

        .sidebar-bottom {

            margin-top: auto;

            display: flex;
            flex-direction: column;

            gap: 8px;
        }


        .sidebar-button {

            width: 100%;

            border:
                1px solid transparent;

            background:
                transparent;

            color:
                var(--text);

            padding: 10px;

            border-radius: 9px;

            cursor: pointer;

            text-align: left;
        }


        .sidebar-button:hover {

            background:
                var(--surface-2);
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            flex: 1;

            min-width: 0;

            display: flex;
            flex-direction: column;

            height: 100vh;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            height: 64px;

            flex-shrink: 0;

            display: flex;
            align-items: center;

            justify-content:
                space-between;

            padding:
                0 24px;

            border-bottom:
                1px solid var(--border);

            background:
                var(--surface);
        }


        .header-left {

            display: flex;
            align-items: center;

            gap: 12px;
        }


        .header-title {

            font-size: 15px;
            font-weight: 650;
        }


        .status {

            display: flex;
            align-items: center;

            gap: 6px;

            font-size: 11px;

            color:
                var(--muted);
        }


        .status-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                #35b86b;
        }


        .status-dot.offline {

            background:
                var(--danger);
        }


        /* =====================================================
           MODEL SELECT
        ===================================================== */

        .model-select {

            border:
                1px solid var(--border);

            background:
                var(--surface);

            color:
                var(--text);

            border-radius: 9px;

            padding:
                8px 11px;

            outline: none;

            cursor: pointer;
        }


        /* =====================================================
           CHAT
        ===================================================== */

        .chat {

            flex: 1;

            min-height: 0;

            overflow-y: auto;

            scroll-behavior: smooth;
        }


        .chat-inner {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            padding:
                30px 24px 150px;
        }


        /* =====================================================
           WELCOME
        ===================================================== */

        .welcome {

            min-height: 55vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;
        }


        .welcome-logo {

            width: 58px;
            height: 58px;

            border-radius: 17px;

            object-fit: cover;

            margin-bottom: 18px;
        }


        .welcome h1 {

            margin: 0;

            font-size: 30px;

            letter-spacing:
                -0.03em;
        }


        .welcome p {

            margin:
                10px 0 0;

            color:
                var(--muted);

            font-size: 14px;
        }


        /* =====================================================
           MESSAGES
        ===================================================== */

        .message {

            display: flex;

            width: 100%;

            margin:
                18px 0;
        }


        .message.user {

            justify-content:
                flex-end;
        }


        .message.assistant {

            justify-content:
                flex-start;
        }


        .message-content {

            max-width: 78%;

            line-height: 1.65;

            font-size: 15px;

            white-space: pre-wrap;

            word-break: break-word;
        }


        .user .message-content {

            background:
                var(--user-bg);

            border-radius: 16px;

            padding:
                11px 15px;
        }


        .assistant .message-content {

            padding:
                5px 0;
        }


        .message-meta {

            font-size: 10px;

            color:
                var(--muted);

            margin-bottom: 5px;
        }


        /* =====================================================
           THINKING
        ===================================================== */

        .thinking {

            display: flex;
            align-items: center;

            gap: 5px;

            padding:
                8px 0;
        }


        .thinking span {

            width: 6px;
            height: 6px;

            background:
                var(--muted);

            border-radius: 50%;

            animation:
                thinking 1.2s infinite ease-in-out;
        }


        .thinking span:nth-child(2) {

            animation-delay:
                0.15s;
        }


        .thinking span:nth-child(3) {

            animation-delay:
                0.3s;
        }


        @keyframes thinking {

            0%,
            80%,
            100% {

                opacity: 0.25;

                transform:
                    translateY(0);
            }

            40% {

                opacity: 1;

                transform:
                    translateY(-3px);
            }
        }


        /* =====================================================
           INPUT
        ===================================================== */

        .composer {

            position: fixed;

            bottom: 0;

            left: 260px;
            right: 0;

            padding:
                18px 24px 22px;

            background:
                linear-gradient(
                    to top,
                    var(--bg) 65%,
                    transparent
                );

            pointer-events: none;
        }


        .composer-inner {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            pointer-events: auto;
        }


        .input-box {

            display: flex;

            align-items: flex-end;

            gap: 10px;

            background:
                var(--surface);

            border:
                1px solid var(--border);

            border-radius: 16px;

            padding:
                10px 10px 10px 15px;

            box-shadow:
                var(--shadow);
        }


        textarea {

            flex: 1;

            resize: none;

            border: none;

            outline: none;

            background:
                transparent;

            color:
                var(--text);

            min-height: 24px;

            max-height: 180px;

            line-height: 1.5;

            padding:
                4px 0;

            font-size: 15px;
        }


        textarea::placeholder {

            color:
                var(--muted);
        }


        .send-button {

            width: 38px;
            height: 38px;

            border: none;

            border-radius: 11px;

            background:
                var(--accent);

            color: white;

            cursor: pointer;

            font-size: 17px;

            display: flex;

            align-items: center;
            justify-content: center;

            transition:
                0.15s ease;
        }


        .send-button:hover {

            background:
                var(--accent-hover);
        }


        .send-button:disabled {

            opacity: 0.45;

            cursor:
                not-allowed;
        }


        .composer-note {

            text-align: center;

            color:
                var(--muted);

            font-size: 10px;

            margin-top: 8px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            .sidebar {
                display: none;
            }

            .composer {
                left: 0;
            }

            .header {
                padding:
                    0 15px;
            }

            .chat-inner {
                padding-left:
                    15px;

                padding-right:
                    15px;
            }

            .message-content {
                max-width:
                    90%;
            }

            .welcome h1 {
                font-size:
                    25px;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">


        <div class="brand">

            <img
                src="logo.jpg"
                class="brand-logo"
                alt="B&B AI"
            >

            <div>

                <div class="brand-name">
                    B&B AI
                </div>

                <div class="brand-subtitle">
                    B&B Studio
                </div>

            </div>

        </div>


        <button
            class="new-chat"
            id="newChatButton"
        >
            + New chat
        </button>


        <div class="nav">

            <div class="nav-title">
                Modes
            </div>

            <a
                class="nav-item active"
                href="text.html"
            >

                💬

                <span>
                    Chat / Text
                </span>

            </a>

        </div>


        <div class="sidebar-bottom">

            <button
                class="sidebar-button"
                id="themeButton"
            >
                🌙 Dark mode
            </button>

        </div>


    </aside>


    <!-- =====================================================
         MAIN
    ===================================================== -->

    <main class="main">


        <header class="header">

            <div class="header-left">

                <div>

                    <div class="header-title">
                        B&B AI
                    </div>

                    <div class="status">

                        <span
                            class="status-dot"
                            id="statusDot"
                        ></span>

                        <span id="statusText">
                            Checking API...
                        </span>

                    </div>

                </div>

            </div>


            <select
                class="model-select"
                id="modelSelect"
            >

                <option value="B&B AI">
                    B&B AI
                </option>

                <option value="B&B AI Lite">
                    B&B AI Lite
                </option>

                <option value="B&B AI Pro">
                    B&B AI Pro
                </option>

                <option value="B&B AI Deep">
                    B&B AI Deep
                </option>

            </select>

        </header>


        <!-- =================================================
             CHAT
        ================================================== -->

        <section
            class="chat"
            id="chat"
        >

            <div
                class="chat-inner"
                id="chatInner"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <img
                        src="logo.jpg"
                        class="welcome-logo"
                        alt="B&B AI"
                    >

                    <h1>
                        What can I help with?
                    </h1>

                    <p>
                        B&B AI · Created by B&B Studio
                    </p>

                </div>

            </div>

        </section>


        <!-- =================================================
             COMPOSER
        ================================================== -->

        <div class="composer">

            <div class="composer-inner">

                <div class="input-box">

                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Message B&B AI..."
                    ></textarea>

                    <button
                        class="send-button"
                        id="sendButton"
                        title="Send"
                    >
                        ↑
                    </button>

                </div>

                <div class="composer-note">

                    B&B AI can make mistakes.
                    Check important information.

                </div>

            </div>

        </div>


    </main>


</div>


<script>

    /* =====================================================
       B&B AI - TEXT CLIENT
       SUPABASE CHAT MEMORY
    ===================================================== */


    /* =====================================================
       API CONFIG
    ===================================================== */

    const API_BASE =
        BBAI_CONFIG.ai.baseUrl.replace(/\/+$/, "");


    const CHAT_ENDPOINT =
        BBAI_CONFIG.ai.endpoints.chat;


    /* =====================================================
       SUPABASE CLIENT
    ===================================================== */

    const supabaseClient =
        window.supabase.createClient(

            BBAI_CONFIG.supabase.url,

            BBAI_CONFIG.supabase.publishableKey

        );


    /* =====================================================
       STATE
    ===================================================== */

    let history = [];

    let isSending = false;

    let currentConversationId = null;

    let currentSession = null;


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const chat =
        document.getElementById("chat");


    const chatInner =
        document.getElementById("chatInner");


    const input =
        document.getElementById("messageInput");


    const sendButton =
        document.getElementById("sendButton");


    const modelSelect =
        document.getElementById("modelSelect");


    const newChatButton =
        document.getElementById("newChatButton");


    const themeButton =
        document.getElementById("themeButton");


    const statusDot =
        document.getElementById("statusDot");


    const statusText =
        document.getElementById("statusText");


    /* =====================================================
       THEME
    ===================================================== */

    function loadTheme() {

        const saved =
            localStorage.getItem("bbai_theme");


        if (saved === "dark") {

            document.documentElement
                .classList
                .add("dark");

            themeButton.textContent =
                "☀️ Light mode";

        } else {

            document.documentElement
                .classList
                .remove("dark");

            themeButton.textContent =
                "🌙 Dark mode";

        }

    }


    function toggleTheme() {

        const isDark =
            document.documentElement
                .classList
                .contains("dark");


        if (isDark) {

            document.documentElement
                .classList
                .remove("dark");

            localStorage.setItem(
                "bbai_theme",
                "light"
            );

            themeButton.textContent =
                "🌙 Dark mode";

        } else {

            document.documentElement
                .classList
                .add("dark");

            localStorage.setItem(
                "bbai_theme",
                "dark"
            );

            themeButton.textContent =
                "☀️ Light mode";

        }

    }


    themeButton.addEventListener(
        "click",
        toggleTheme
    );


    loadTheme();


    /* =====================================================
       GET SESSION
    ===================================================== */

    async function loadSession() {

        try {

            const result =
                await supabaseClient.auth.getSession();


            if (result.error) {

                console.error(
                    "Supabase session error:",
                    result.error
                );

                currentSession = null;

                return null;
            }


            currentSession =
                result.data.session;


            return currentSession;


        } catch (error) {

            console.error(
                "Session error:",
                error
            );

            currentSession = null;

            return null;
        }

    }


    /* =====================================================
       AUTH HEADERS
    ===================================================== */

    function getAuthHeaders() {

        const headers = {

            "Content-Type":
                "application/json"

        };


        if (
            currentSession &&
            currentSession.access_token
        ) {

            headers["Authorization"] =
                `Bearer ${currentSession.access_token}`;

        }


        return headers;

    }


    /* =====================================================
       API STATUS
    ===================================================== */

    async function checkAPI() {

        try {

            const response =
                await fetch(

                    `${API_BASE}/api/status`,

                    {
                        method: "GET",
                        cache: "no-store"
                    }

                );


            if (!response.ok) {

                throw new Error(
                    `API HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            const healthy =
                data.success === true &&
                data.ollama === true;


            if (healthy) {

                statusDot.classList.remove(
                    "offline"
                );

                statusText.textContent =
                    "Online";

            } else {

                statusDot.classList.add(
                    "offline"
                );

                statusText.textContent =
                    "AI offline";

            }


        } catch (error) {

            console.error(
                "API status error:",
                error
            );

            statusDot.classList.add(
                "offline"
            );

            statusText.textContent =
                "API offline";

        }

    }


    /* =====================================================
       ADD MESSAGE
    ===================================================== */

    function addMessage(
        role,
        content,
        modelName = null
    ) {

        const welcome =
            document.getElementById("welcome");


        if (welcome) {

            welcome.style.display =
                "none";

        }


        const message =
            document.createElement("div");


        message.className =
            `message ${role}`;


        const wrapper =
            document.createElement("div");


        const meta =
            document.createElement("div");


        meta.className =
            "message-meta";


        meta.textContent =
            role === "user"
                ? "You"
                : (
                    modelName ||
                    modelSelect.value
                );


        const text =
            document.createElement("div");


        text.className =
            "message-content";


        text.textContent =
            content;


        wrapper.appendChild(meta);

        wrapper.appendChild(text);

        message.appendChild(wrapper);

        chatInner.appendChild(message);


        scrollToBottom();


        return message;

    }


    /* =====================================================
       THINKING
    ===================================================== */

    function addThinking() {

        const welcome =
            document.getElementById("welcome");


        if (welcome) {

            welcome.style.display =
                "none";

        }


        const message =
            document.createElement("div");


        message.className =
            "message assistant";


        const thinking =
            document.createElement("div");


        thinking.className =
            "thinking";


        thinking.innerHTML = `
            <span></span>
            <span></span>
            <span></span>
        `;


        message.appendChild(thinking);

        chatInner.appendChild(message);


        scrollToBottom();


        return message;

    }


    /* =====================================================
       SCROLL
    ===================================================== */

    function scrollToBottom() {

        requestAnimationFrame(() => {

            chat.scrollTop =
                chat.scrollHeight;

        });

    }


    /* =====================================================
       CREATE CONVERSATION
    ===================================================== */

    async function createConversation() {

        if (!currentSession) {

            throw new Error(
                "Please log in first."
            );

        }


        const response =
            await fetch(

                `${API_BASE}/v1/conversations`,

                {

                    method: "POST",

                    headers:
                        getAuthHeaders(),

                    body:
                        JSON.stringify({

                            title:
                                "New Chat",

                            model:
                                modelSelect.value

                        })

                }

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success ||
            !data.conversation
        ) {

            throw new Error(
                data.error ||
                "Could not create conversation."
            );

        }


        currentConversationId =
            data.conversation.id;


        return currentConversationId;

    }


    /* =====================================================
       SAVE MESSAGE
    ===================================================== */

    async function saveMessage(
        role,
        content,
        model = null
    ) {

        if (!currentSession) {

            throw new Error(
                "Please log in first."
            );

        }


        if (!currentConversationId) {

            await createConversation();

        }


        const response =
            await fetch(

                `${API_BASE}` +
                `/v1/conversations/` +
                `${currentConversationId}` +
                `/messages`,

                {

                    method: "POST",

                    headers:
                        getAuthHeaders(),

                    body:
                        JSON.stringify({

                            role:
                                role,

                            content:
                                content,

                            model:
                                model ||
                                modelSelect.value

                        })

                }

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Could not save message."
            );

        }


        return data.message;

    }


    /* =====================================================
       LOAD CONVERSATIONS
    ===================================================== */

    async function loadConversations() {

        if (!currentSession) {

            return [];

        }


        const response =
            await fetch(

                `${API_BASE}/v1/conversations`,

                {

                    method: "GET",

                    headers:
                        getAuthHeaders(),

                    cache:
                        "no-store"

                }

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Could not load conversations."
            );

        }


        return (
            data.conversations ||
            []
        );

    }


    /* =====================================================
       LOAD MESSAGES
    ===================================================== */

    async function loadMessages(
        conversationId
    ) {

        if (!currentSession) {

            return [];

        }


        const response =
            await fetch(

                `${API_BASE}` +
                `/v1/conversations/` +
                `${conversationId}` +
                `/messages`,

                {

                    method: "GET",

                    headers:
                        getAuthHeaders(),

                    cache:
                        "no-store"

                }

            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Could not load messages."
            );

        }


        return (
            data.messages ||
            []
        );

    }


    /* =====================================================
       DISPLAY MESSAGES
    ===================================================== */

    function displayMessages(messages) {

        chatInner.innerHTML = "";


        if (!messages.length) {

            showWelcome();

            history = [];

            return;

        }


        history =
            messages.map(message => ({

                role:
                    message.role,

                content:
                    message.content

            }));


        for (const message of messages) {

            addMessage(

                message.role,

                message.content,

                message.model

            );

        }


        scrollToBottom();

    }


    /* =====================================================
       SHOW WELCOME
    ===================================================== */

    function showWelcome() {

        chatInner.innerHTML = `

            <div
                class="welcome"
                id="welcome"
            >

                <img
                    src="logo.jpg"
                    class="welcome-logo"
                    alt="B&B AI"
                >

                <h1>
                    What can I help with?
                </h1>

                <p>
                    B&B AI · Created by B&B Studio
                </p>

            </div>

        `;

    }


    /* =====================================================
       LOAD LAST CONVERSATION
    ===================================================== */

    async function loadLastConversation() {

        if (!currentSession) {

            return;

        }


        try {

            const conversations =
                await loadConversations();


            if (!conversations.length) {

                return;

            }


            const latest =
                conversations[0];


            currentConversationId =
                latest.id;


            if (
                latest.model &&
                [
                    "B&B AI",
                    "B&B AI Lite",
                    "B&B AI Pro",
                    "B&B AI Deep"
                ].includes(latest.model)
            ) {

                modelSelect.value =
                    latest.model;

            }


            const messages =
                await loadMessages(
                    latest.id
                );


            displayMessages(messages);


        } catch (error) {

            console.error(
                "Load conversation error:",
                error
            );

        }

    }


    /* =====================================================
       SEND MESSAGE
    ===================================================== */

    async function sendMessage() {

        if (isSending) {

            return;

        }


        const message =
            input.value.trim();


        if (!message) {

            return;

        }


        isSending = true;

        sendButton.disabled =
            true;


        const selectedModel =
            modelSelect.value;


        let thinking = null;


        try {

            /* =============================================
               AUTH
            ============================================= */

            if (!currentSession) {

                await loadSession();

            }


            if (!currentSession) {

                throw new Error(
                    "Please log in first."
                );

            }


            /* =============================================
               CONVERSATION
            ============================================= */

            if (!currentConversationId) {

                await createConversation();

            }


            /* =============================================
               SAVE CURRENT USER MESSAGE
               ============================================= */

            addMessage(
                "user",
                message
            );


            input.value = "";

            resizeTextarea();


            /*
             * IMPORTANT:
             * Save the message first,
             * but do not stop the AI request
             * if Supabase saving fails.
             */

            try {

                await saveMessage(
                    "user",
                    message,
                    selectedModel
                );

            } catch (saveError) {

                console.error(
                    "User message save error:",
                    saveError
                );

            }


            /* =============================================
               AI HISTORY
            ============================================= */

            const aiHistory =
                [...history];


            /*
             * The current user message is not yet inside
             * history at this exact point, so include it.
             */

            aiHistory.push({

                role:
                    "user",

                content:
                    message

            });


            /* =============================================
               THINKING
            ============================================= */

            thinking =
                addThinking();


            /* =============================================
               CALL B&B AI
            ============================================= */

            const response =
                await fetch(

                    `${API_BASE}` +
                    `${CHAT_ENDPOINT}`,

                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                message:
                                    message,

                                model:
                                    selectedModel,

                                history:
                                    aiHistory

                            })

                    }

                );


            let data = null;


            try {

                data =
                    await response.json();

            } catch {

                throw new Error(
                    `Invalid API response (${response.status})`
                );

            }


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.error ||
                    `AI request failed (${response.status})`
                );

            }


            /* =============================================
               REMOVE THINKING
            ============================================= */

            if (thinking) {

                thinking.remove();

                thinking = null;

            }


            const reply =
                data.reply ||
                "No response received.";


            /* =============================================
               SHOW AI RESPONSE
            ============================================= */

            addMessage(

                "assistant",

                reply,

                data.name ||
                selectedModel

            );


            /* =============================================
               SAVE AI RESPONSE
            ============================================= */

            try {

                await saveMessage(

                    "assistant",

                    reply,

                    selectedModel

                );

            } catch (saveError) {

                console.error(
                    "Assistant message save error:",
                    saveError
                );

            }


            /* =============================================
               UPDATE LOCAL HISTORY
            ============================================= */

            history.push({

                role:
                    "user",

                content:
                    message

            });


            history.push({

                role:
                    "assistant",

                content:
                    reply

            });


        } catch (error) {

            console.error(
                "Send message error:",
                error
            );


            if (thinking) {

                thinking.remove();

            }


            addMessage(

                "assistant",

                "⚠️ Error: " +
                error.message

            );

        } finally {

            isSending = false;

            sendButton.disabled =
                false;

            input.focus();

        }

    }


    /* =====================================================
       NEW CHAT
    ===================================================== */

    newChatButton.addEventListener(

        "click",

        function() {

            if (isSending) {

                return;

            }


            history = [];


            currentConversationId =
                null;


            showWelcome();


            input.value =
                "";


            resizeTextarea();


            input.focus();

        }

    );


    /* =====================================================
       MODEL CHANGE
    ===================================================== */

    modelSelect.addEventListener(

        "change",

        function() {

            console.log(
                "B&B AI model:",
                modelSelect.value
            );

        }

    );


    /* =====================================================
       SEND BUTTON
    ===================================================== */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    /* =====================================================
       ENTER TO SEND
    ===================================================== */

    input.addEventListener(

        "keydown",

        function(event) {

            if (

                event.key === "Enter" &&

                !event.shiftKey

            ) {

                event.preventDefault();

                sendMessage();

            }

        }

    );


    /* =====================================================
       AUTO RESIZE
    ===================================================== */

    function resizeTextarea() {

        input.style.height =
            "auto";


        input.style.height =
            Math.min(
                input.scrollHeight,
                180
            ) + "px";

    }


    input.addEventListener(
        "input",
        resizeTextarea
    );


    /* =====================================================
       SUPABASE AUTH STATE
    ===================================================== */

    supabaseClient.auth.onAuthStateChange(

        async function(
            event,
            session
        ) {

            currentSession =
                session;


            if (
                event === "SIGNED_IN"
            ) {

                await loadLastConversation();

            }


            if (
                event === "SIGNED_OUT"
            ) {

                currentSession =
                    null;

                currentConversationId =
                    null;

                history = [];

                showWelcome();

            }

        }

    );


    /* =====================================================
       START
    ===================================================== */

    async function start() {

        loadTheme();

        resizeTextarea();

        await loadSession();

        await checkAPI();


        if (currentSession) {

            await loadLastConversation();

        }


        input.focus();

    }


    start();

</script>


</body>
