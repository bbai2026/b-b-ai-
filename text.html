<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="B&B AI - chat with B&B AI, created by B&B Studio.">

<title>B&B AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="api.js"></script>

<style>

:root {
    --bg: #ffffff;
    --sidebar: #f7f7f9;
    --surface: #ffffff;
    --surface-2: #f1f1f4;
    --text: #111116;
    --muted: #74747f;
    --border: #e5e5ea;
    --user-bg: #f0f0f3;
    --accent: #7c5cff;
    --accent-hover: #6948ed;
    --danger: #d93a3f;
    --danger-bg: #fdeeee;
    --success: #1d7f4b;
    --shadow: 0 12px 35px rgba(0, 0, 0, 0.07);
}

html.dark {
    --bg: #09090d;
    --sidebar: #101014;
    --surface: #0d0d12;
    --surface-2: #19191f;
    --text: #f5f5f7;
    --muted: #9494a0;
    --border: #2a2a33;
    --user-bg: #1b1b22;
    --accent: #9277ff;
    --accent-hover: #a58dff;
    --danger: #ff6268;
    --danger-bg: #2b1416;
    --success: #53d18a;
    --shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
textarea,
select {
    font: inherit;
    color: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

[hidden] {
    display: none !important;
}


/* =====================================================
   LAYOUT
   ===================================================== */

.app {
    display: flex;
    width: 100%;
    height: 100vh;
    height: 100dvh;
}

.sidebar {
    width: 280px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 14px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    min-height: 0;
}

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    position: relative;
}


/* =====================================================
   SIDEBAR
   ===================================================== */

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 6px 16px;
}

.brand-mark {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: -0.02em;
    flex-shrink: 0;
}

.brand-name {
    font-size: 16px;
    font-weight: 750;
}

.brand-subtitle {
    margin-top: 2px;
    font-size: 11px;
    color: var(--muted);
}

.new-chat {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--surface);
    cursor: pointer;
    text-align: left;
    font-size: 14px;
    transition: background 0.15s ease, transform 0.15s ease;
}

.new-chat:hover {
    background: var(--surface-2);
}

.new-chat:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.chat-list-title {
    margin: 20px 7px 8px;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
}

.chat-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.chat-empty {
    padding: 10px 8px;
    font-size: 12px;
    color: var(--muted);
}

.chat-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 6px 8px 9px;
    border-radius: 9px;
    cursor: pointer;
    position: relative;
}

.chat-item:hover,
.chat-item.active {
    background: var(--surface-2);
}

.chat-item-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
}

.chat-menu {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    opacity: 0;
}

.chat-item:hover .chat-menu,
.chat-item.active .chat-menu,
.chat-menu:focus-visible {
    opacity: 1;
}

.chat-menu:hover {
    background: var(--border);
    color: var(--text);
}

.sidebar-bottom {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
}

.user-email {
    padding: 6px 9px 8px;
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.sidebar-button {
    width: 100%;
    padding: 9px 10px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    cursor: pointer;
    text-align: left;
    font-size: 13px;
}

.sidebar-button:hover {
    background: var(--surface-2);
}

.sidebar-button.logout {
    color: var(--danger);
}


/* =====================================================
   HEADER
   ===================================================== */

.header {
    height: 64px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}

.menu-toggle {
    display: none;
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    cursor: pointer;
    font-size: 16px;
}

.header-title {
    font-size: 15px;
    font-weight: 700;
}

.status {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
    font-size: 11px;
    color: var(--muted);
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #35b86b;
    flex-shrink: 0;
}

.status-dot.offline {
    background: var(--danger);
}

.model-select {
    max-width: 230px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    outline: none;
    cursor: pointer;
}

.model-select:focus {
    border-color: var(--accent);
}


/* =====================================================
   BANNER
   ===================================================== */

.banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 24px;
    background: var(--danger-bg);
    color: var(--danger);
    font-size: 13px;
    border-bottom: 1px solid var(--border);
}

.banner button {
    flex-shrink: 0;
    padding: 6px 11px;
    border: 1px solid currentColor;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
}


/* =====================================================
   CHAT
   ===================================================== */

.chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
}

.chat-inner {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 24px 170px;
}

.welcome {
    min-height: 52vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.welcome-mark {
    width: 60px;
    height: 60px;
    margin-bottom: 18px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.02em;
}

.welcome h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: -0.035em;
}

.welcome p {
    margin: 9px 0 0;
    font-size: 14px;
    color: var(--muted);
}

.message {
    display: flex;
    width: 100%;
    margin: 18px 0;
}

.message.user {
    justify-content: flex-end;
}

.message.assistant {
    justify-content: flex-start;
}

.message-wrapper {
    max-width: 78%;
    min-width: 0;
}

.message-meta {
    margin-bottom: 5px;
    font-size: 11px;
    color: var(--muted);
}

.message.user .message-meta {
    text-align: right;
}

.message-content {
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
}

.message.user .message-content {
    background: var(--user-bg);
    padding: 11px 15px;
    border-radius: 16px;
}

.message-actions {
    display: flex;
    gap: 4px;
    margin-top: 4px;
}

.message-action {
    width: 28px;
    height: 28px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
}

.message-action:hover {
    background: var(--surface-2);
    color: var(--text);
}

.notice-line {
    margin: 14px auto;
    max-width: 90%;
    padding: 10px 14px;
    border-radius: 11px;
    background: var(--danger-bg);
    color: var(--danger);
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
}

.thinking {
    display: flex;
    gap: 5px;
    padding: 10px 0;
}

.thinking span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: thinking 1.2s infinite ease-in-out;
}

.thinking span:nth-child(2) {
    animation-delay: 0.15s;
}

.thinking span:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes thinking {
    0%, 80%, 100% {
        opacity: 0.25;
        transform: translateY(0);
    }
    40% {
        opacity: 1;
        transform: translateY(-3px);
    }
}


/* =====================================================
   COMPOSER
   ===================================================== */

.composer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 18px 24px 20px;
    background: linear-gradient(to top, var(--bg) 68%, transparent);
    pointer-events: none;
}

.composer-inner {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    pointer-events: auto;
}

.input-box {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px 10px 10px 15px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
}

.input-box:focus-within {
    border-color: var(--accent);
}

textarea {
    flex: 1;
    min-height: 24px;
    max-height: 180px;
    resize: none;
    padding: 4px 0;
    border: none;
    outline: none;
    background: transparent;
    line-height: 1.5;
    font-size: 15px;
}

textarea::placeholder {
    color: var(--muted);
}

.send-button {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 11px;
    background: var(--accent);
    color: #ffffff;
    cursor: pointer;
    font-size: 17px;
}

.send-button:hover {
    background: var(--accent-hover);
}

.send-button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.composer-note {
    margin-top: 8px;
    text-align: center;
    font-size: 10px;
    color: var(--muted);
}


/* =====================================================
   POPOVER, MODAL, TOAST
   ===================================================== */

.popover {
    position: fixed;
    z-index: 200;
    min-width: 150px;
    padding: 5px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 11px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
}

.popover button {
    display: block;
    width: 100%;
    padding: 9px 11px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    text-align: left;
    font-size: 13px;
}

.popover button:hover {
    background: var(--surface-2);
}

.popover button.danger {
    color: var(--danger);
}

.modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(6px);
}

.modal-backdrop.show {
    display: flex;
}

.modal {
    width: min(430px, 100%);
    padding: 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 25px 80px rgba(0, 0, 0, 0.25);
}

.modal h2 {
    margin: 0 0 8px;
    font-size: 18px;
}

.modal p {
    margin: 0;
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
    white-space: pre-line;
}

.modal-input {
    width: 100%;
    margin-top: 14px;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: var(--surface-2);
}

.modal-input:focus {
    border-color: var(--accent);
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
}

.modal-button {
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    cursor: pointer;
    font-size: 13px;
}

.modal-button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
}

.modal-button.danger {
    background: var(--danger);
    border-color: var(--danger);
    color: #ffffff;
}

.modal-button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.toast {
    position: fixed;
    left: 50%;
    bottom: 110px;
    transform: translateX(-50%);
    z-index: 300;
    max-width: min(480px, calc(100% - 32px));
    padding: 11px 16px;
    border-radius: 11px;
    background: var(--text);
    color: var(--bg);
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 800px) {

    .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 150;
        transform: translateX(-102%);
        transition: transform 0.2s ease;
        box-shadow: var(--shadow);
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .menu-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .header {
        padding: 0 14px;
    }

    .model-select {
        max-width: 150px;
    }

    .chat-inner {
        padding: 20px 14px 160px;
    }

    .message-wrapper {
        max-width: 90%;
    }

    .composer {
        padding: 14px 12px 16px;
    }

    .welcome h1 {
        font-size: 25px;
    }

    .chat-menu {
        opacity: 1;
    }
}

</style>

</head>


<body>

<div class="app">


<!-- ==========================================================
     SIDEBAR
=========================================================== -->

<aside class="sidebar" id="sidebar">

    <div class="brand">
        <div class="brand-mark">B&amp;B</div>
        <div>
            <div class="brand-name">B&amp;B AI</div>
            <div class="brand-subtitle">B&amp;B Studio</div>
        </div>
    </div>

    <button class="new-chat" id="newChatButton" type="button">
        + New chat
    </button>

    <div class="chat-list-title">Chats</div>

    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-bottom">

        <div class="user-email" id="userEmail"></div>

        <button class="sidebar-button" id="themeButton" type="button">
            Dark mode
        </button>

        <button class="sidebar-button" id="aboutButton" type="button">
            About B&amp;B Studio
        </button>

        <button class="sidebar-button logout" id="logoutButton" type="button">
            Log out
        </button>

    </div>

</aside>


<!-- ==========================================================
     MAIN
=========================================================== -->

<main class="main">

<header class="header">

    <div class="header-left">

        <button
            class="menu-toggle"
            id="menuToggle"
            type="button"
            aria-label="Open chats"
        >
            ☰
        </button>

        <div>
            <div class="header-title">B&amp;B AI</div>
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Checking connection...</span>
            </div>
        </div>

    </div>

    <select
        class="model-select"
        id="modelSelect"
        aria-label="Select model"
    >
        <option value="B&amp;B AI">B&amp;B AI</option>
    </select>

</header>

<div class="banner" id="banner" role="alert" hidden>
    <span id="bannerText"></span>
    <button type="button" id="bannerRetry">Check again</button>
</div>

<section class="chat" id="chat">
    <div class="chat-inner" id="chatInner"></div>
</section>

<div class="composer">

    <div class="composer-inner">

        <div class="input-box">

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Message B&amp;B AI..."
                aria-label="Message"
            ></textarea>

            <button
                class="send-button"
                id="sendButton"
                type="button"
                title="Send"
                aria-label="Send message"
            >
                ↑
            </button>

        </div>

        <div class="composer-note">
            B&amp;B AI can make mistakes. Check important information.
        </div>

    </div>

</div>

</main>

</div>


<!-- ==========================================================
     CHAT MENU (rename / delete)
=========================================================== -->

<div class="popover" id="popover" hidden>
    <button type="button" data-action="rename">Rename</button>
    <button type="button" data-action="delete" class="danger">Delete</button>
</div>


<!-- ==========================================================
     DIALOG (rename / delete / about)
=========================================================== -->

<div class="modal-backdrop" id="modalBackdrop">

    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

        <h2 id="modalTitle"></h2>

        <p id="modalDescription"></p>

        <input
            class="modal-input"
            id="modalInput"
            type="text"
            maxlength="100"
            autocomplete="off"
            hidden
        >

        <div class="modal-actions">
            <button class="modal-button" id="modalCancel" type="button">Cancel</button>
            <button class="modal-button primary" id="modalConfirm" type="button">Save</button>
        </div>

    </div>

</div>


<div class="toast" id="toast" role="status" hidden></div>


<script>

/* =====================================================
   B&B AI v0.1 - Chat application
   ===================================================== */


/* -----------------------------------------------------
   Configuration
   ----------------------------------------------------- */

const API_BASE = BBAI_CONFIG.ai.baseUrl.replace(/\/+$/, "");

const APP_PAGE = "text.html";
const LOGIN_PAGE = "index.html";

const DEFAULT_MODEL = "B&B AI";

const DEFAULT_TITLE = "New Chat";

const MODEL_FALLBACK = [
    "B&B AI",
    "B&B AI Lite",
    "B&B AI Pro",
    "B&B AI Deep"
];

const MAX_MESSAGE_CHARS = 8000;

const MAX_HISTORY_MESSAGES = 40;

const REQUEST_TIMEOUT_MS = 30000;

const CHAT_TIMEOUT_MS = 240000;

const LAST_CHAT_KEY_PREFIX = "bbai_last_conversation_";


/* -----------------------------------------------------
   Clients
   ----------------------------------------------------- */

const supabaseClient = window.supabase.createClient(
    BBAI_CONFIG.supabase.url,
    BBAI_CONFIG.supabase.publishableKey
);


/* -----------------------------------------------------
   State
   ----------------------------------------------------- */

let session = null;

let conversations = [];

let currentConversationId = null;

let history = [];

let isSending = false;

let apiOnline = false;

let openedMenuConversationId = null;

let dialogAction = null;


/* -----------------------------------------------------
   Elements
   ----------------------------------------------------- */

const el = {
    sidebar: document.getElementById("sidebar"),
    menuToggle: document.getElementById("menuToggle"),
    chat: document.getElementById("chat"),
    chatInner: document.getElementById("chatInner"),
    chatList: document.getElementById("chatList"),
    input: document.getElementById("messageInput"),
    sendButton: document.getElementById("sendButton"),
    modelSelect: document.getElementById("modelSelect"),
    newChatButton: document.getElementById("newChatButton"),
    themeButton: document.getElementById("themeButton"),
    aboutButton: document.getElementById("aboutButton"),
    logoutButton: document.getElementById("logoutButton"),
    userEmail: document.getElementById("userEmail"),
    statusDot: document.getElementById("statusDot"),
    statusText: document.getElementById("statusText"),
    banner: document.getElementById("banner"),
    bannerText: document.getElementById("bannerText"),
    bannerRetry: document.getElementById("bannerRetry"),
    popover: document.getElementById("popover"),
    modalBackdrop: document.getElementById("modalBackdrop"),
    modalTitle: document.getElementById("modalTitle"),
    modalDescription: document.getElementById("modalDescription"),
    modalInput: document.getElementById("modalInput"),
    modalCancel: document.getElementById("modalCancel"),
    modalConfirm: document.getElementById("modalConfirm"),
    toast: document.getElementById("toast")
};


/* -----------------------------------------------------
   Errors
   ----------------------------------------------------- */

class ApiError extends Error {

    constructor(message, status = 0) {
        super(message);
        this.name = "ApiError";
        this.status = status;
    }
}

function defaultMessageForStatus(status) {

    if (status === 401) return "Your session has expired. Please log in again.";
    if (status === 404) return "That item could not be found.";
    if (status === 429) return "Too many requests. Please wait a moment.";
    if (status === 501) return "This feature is not available yet.";
    if (status === 503) return "The AI service is temporarily unavailable. Please try again.";
    if (status === 504) return "The request took too long. Please try again.";
    return "Something went wrong. Please try again.";
}

async function getAccessToken() {

    if (error || !data.session) {
        session = null;
        return null;
    }

    session = data.session;

}

function goToLogin(reason) {

    window.location.replace(LOGIN_PAGE + query);
}

/* -----------------------------------------------------
   HTTP helper
   ----------------------------------------------------- */

async function apiRequest(path, options = {}) {

    const {
        method = "GET",
        body,
        auth = false,
        timeout = REQUEST_TIMEOUT_MS
    } = options;

    const headers = {
        "bypass-tunnel-reminder": "true"
    };

    if (body !== undefined) {
        headers["Content-Type"] = "application/json";
    }

    if (auth) {

        const token = await getAccessToken();

        if (!token) {
            throw new ApiError("Your session has expired. Please log in again.", 401);
        }

        headers["Authorization"] = `Bearer ${token}`;
    }

    const controller = new AbortController();

    const timer = setTimeout(() => controller.abort(), timeout);

    let response;

    try {

        response = await fetch(API_BASE + path, {
            method,
            headers,
            body: body !== undefined ? JSON.stringify(body) : undefined,
            cache: "no-store",
            signal: controller.signal
        });

    } catch (error) {

        if (error.name === "AbortError") {
            throw new ApiError("The request took too long. Please try again.", 504);
        }

        throw new ApiError(
            "Cannot reach the B&B AI server. Please check that the backend and LocalTunnel are running.",
            0
        );

    } finally {

        clearTimeout(timer);
    }

    let data = null;

    try {
        data = await response.json();
    } catch {
        data = null;
    }

    if (!data || typeof data !== "object") {

        throw new ApiError(
            "The B&B AI server returned an unexpected response.",
            response.status
        );
    }

    if (!response.ok || data.success === false) {

        throw new ApiError(
            data.error || defaultMessageForStatus(response.status),
            response.status
        );
    }

    return data;
}

        }

        setApiStatus(false, "Offline");

    }
}

    el.bannerText.textContent = message;
    el.banner.hidden = false;

async function loadModels() {

    let models = null;

    try {

        const data = await apiRequest("/v1/models");

        models = data.models || null;

    } catch (error) {

        console.error("Model list error:", error);
    }

    const names = models ? Object.keys(models) : MODEL_FALLBACK;

    el.modelSelect.innerHTML = "";

        el.modelSelect.appendChild(option);
    }

    el.modelSelect.value = names.includes(DEFAULT_MODEL)
        ? DEFAULT_MODEL
        : names[0];

/* -----------------------------------------------------
   Rendering
   ----------------------------------------------------- */

function removeWelcome() {

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }
}

function showWelcome() {

    el.chatInner.innerHTML = `
        <div class="welcome" id="welcome">
            <div class="welcome-mark">B&amp;B</div>
            <h1>What can I help with?</h1>
            <p>B&amp;B AI · Created by B&amp;B Studio</p>
        </div>
    `;
}

function scrollToBottom() {

    requestAnimationFrame(() => {
        el.chat.scrollTop = el.chat.scrollHeight;
    });
}

function addMessage(role, content, modelName = null) {

    removeWelcome();

    const message = document.createElement("div");
    message.className = `message ${role}`;

    const wrapper = document.createElement("div");
    wrapper.className = "message-wrapper";

    const meta = document.createElement("div");
    meta.className = "message-meta";
    meta.textContent = role === "user" ? "You" : (modelName || el.modelSelect.value);

    const text = document.createElement("div");
    text.className = "message-content";
    text.textContent = content;

    wrapper.appendChild(meta);
    wrapper.appendChild(text);

    if (role === "assistant") {

        const actions = document.createElement("div");
        actions.className = "message-actions";

        const copy = document.createElement("button");
        copy.className = "message-action";
        copy.type = "button";
        copy.textContent = "⧉";
        copy.title = "Copy";
        copy.setAttribute("aria-label", "Copy message");

        copy.addEventListener("click", async () => {

            try {

                await navigator.clipboard.writeText(content);

                copy.textContent = "✓";

                setTimeout(() => {
                    copy.textContent = "⧉";
                }, 1200);

            } catch {

                showToast("Could not copy the message.");
            }
        });

        actions.appendChild(copy);
        wrapper.appendChild(actions);
    }

    message.appendChild(wrapper);
    el.chatInner.appendChild(message);

    scrollToBottom();

    return message;
}

function addNotice(text) {

    removeWelcome();

    const notice = document.createElement("div");
    notice.className = "notice-line";
    notice.textContent = text;

    el.chatInner.appendChild(notice);

    scrollToBottom();
}

function addThinking() {

    removeWelcome();

    const message = document.createElement("div");
    message.className = "message assistant";

    const dots = document.createElement("div");
    dots.className = "thinking";
    dots.setAttribute("aria-label", "B&B AI is typing");
    dots.innerHTML = "<span></span><span></span><span></span>";

    message.appendChild(dots);
    el.chatInner.appendChild(message);

    scrollToBottom();

    return message;
}

function renderMessages(messages) {

    el.chatInner.innerHTML = "";

    if (!messages.length) {
        showWelcome();
        return;
    }

    for (const message of messages) {
        addMessage(message.role, message.content, message.model);
    }

    scrollToBottom();
}

function renderChatList() {

    el.chatList.innerHTML = "";

    if (!conversations.length) {

        const empty = document.createElement("div");
        empty.className = "chat-empty";
        empty.textContent = "No conversations yet.";

        el.chatList.appendChild(empty);
        return;
    }

    for (const conversation of conversations) {

        const item = document.createElement("div");
        item.className = "chat-item";

        if (conversation.id === currentConversationId) {
            item.classList.add("active");
        }

        const title = document.createElement("div");
        title.className = "chat-item-title";
        title.textContent = conversation.title || DEFAULT_TITLE;
        title.title = conversation.title || DEFAULT_TITLE;

        const menu = document.createElement("button");
        menu.className = "chat-menu";
        menu.type = "button";
        menu.textContent = "⋯";
        menu.title = "More";
        menu.setAttribute("aria-label", "Chat options");

        item.addEventListener("click", () => {

            closeSidebarOnMobile();

            openConversation(conversation.id);
        });

        menu.addEventListener("click", (event) => {

            event.stopPropagation();

            openPopover(conversation.id, menu);
        });

        item.appendChild(title);
        item.appendChild(menu);

        el.chatList.appendChild(item);
    }
}


/* -----------------------------------------------------
   Popover (chat options)
   ----------------------------------------------------- */

function openPopover(conversationId, anchor) {

    if (openedMenuConversationId === conversationId && !el.popover.hidden) {
        closePopover();
        return;
    }

    openedMenuConversationId = conversationId;

    const rect = anchor.getBoundingClientRect();

    el.popover.hidden = false;

    const width = el.popover.offsetWidth;

    const left = Math.min(rect.left, window.innerWidth - width - 8);

    el.popover.style.left = `${Math.max(8, left)}px`;
    el.popover.style.top = `${rect.bottom + 6}px`;
}

function closePopover() {

    el.popover.hidden = true;
    openedMenuConversationId = null;
}

el.popover.addEventListener("click", (event) => {

    const button = event.target.closest("button[data-action]");

    if (!button) {
        return;
    }

    const conversation = conversations.find(
        item => item.id === openedMenuConversationId
    );

    const action = button.dataset.action;

    closePopover();

    if (!conversation) {
        return;
    }

    if (action === "rename") {
        openRenameDialog(conversation);
    }

    if (action === "delete") {
        openDeleteDialog(conversation);
    }
});

document.addEventListener("click", closePopover);

window.addEventListener("resize", closePopover);


/* -----------------------------------------------------
   Dialog
   ----------------------------------------------------- */

function openDialog({ title, description, input = null, confirmText, danger = false, onConfirm, showCancel = true }) {

    el.modalTitle.textContent = title;
    el.modalDescription.textContent = description || "";

    el.modalInput.hidden = input === null;

    if (input !== null) {
        el.modalInput.value = input.value || "";
        el.modalInput.placeholder = input.placeholder || "";
    }

    el.modalConfirm.textContent = confirmText;
    el.modalConfirm.className = `modal-button ${danger ? "danger" : "primary"}`;
    el.modalConfirm.disabled = false;

    el.modalCancel.hidden = !showCancel;

    dialogAction = onConfirm;

    el.modalBackdrop.classList.add("show");

    if (input !== null) {
        setTimeout(() => {
            el.modalInput.focus();
            el.modalInput.select();
        }, 40);
    } else {
        el.modalConfirm.focus();
    }
}

function closeDialog() {

    el.modalBackdrop.classList.remove("show");

    dialogAction = null;
}

function openRenameDialog(conversation) {

    openDialog({
        title: "Rename chat",
        description: "Choose a new name for this conversation.",
        input: {
            value: conversation.title || "",
            placeholder: "Chat name"
        },
        confirmText: "Save",
        onConfirm: () => renameConversation(conversation.id)
    });
}

function openDeleteDialog(conversation) {

    openDialog({
        title: "Delete chat",
        description: `"${conversation.title || DEFAULT_TITLE}" and all of its messages will be permanently deleted.`,
        confirmText: "Delete",
        danger: true,
        onConfirm: () => deleteConversation(conversation.id)
    });
}

function openAboutDialog() {

    openDialog({
        title: "About B&B AI",
        description:
            "B&B AI is part of B&B Studio. We Make Ideas Real.\n\n" +
            "Version v0.1 · Text AI\n" +
            "Created by Barad Bolhasani.",
        confirmText: "OK",
        showCancel: false,
        onConfirm: closeDialog
    });
}

el.modalCancel.addEventListener("click", closeDialog);

el.modalConfirm.addEventListener("click", async () => {

    if (!dialogAction) {
        closeDialog();
        return;
    }

    el.modalConfirm.disabled = true;

    try {

        await dialogAction();

    } finally {

        el.modalConfirm.disabled = false;
    }
});

el.modalBackdrop.addEventListener("click", (event) => {

    if (event.target === el.modalBackdrop) {
        closeDialog();
    }
});

el.modalInput.addEventListener("keydown", (event) => {

    if (event.key === "Enter") {
        event.preventDefault();
        el.modalConfirm.click();
    }

    if (event.key === "Escape") {
        closeDialog();
    }
});

document.addEventListener("keydown", (event) => {

    if (event.key === "Escape" && el.modalBackdrop.classList.contains("show")) {
        closeDialog();
    }
});


/* -----------------------------------------------------
   Conversations API
   ----------------------------------------------------- */

async function getCurrentUserId() {

    const { data, error } = await supabaseClient.auth.getUser();

    if (error || !data.user) {
        throw new ApiError("Your session has expired. Please log in again.", 401);
    }

    session = session || { user: data.user };
    return data.user.id;
}

function databaseError(error, fallback = "Could not access your conversations. Please try again.") {

    console.error("Supabase database error:", error);

    const message = String(error?.message || "").toLowerCase();

    if (message.includes("row-level security") || message.includes("permission denied")) {
        return new ApiError("You do not have permission to access this conversation.", 403);
    }

    return new ApiError(fallback, 0);
}

async function loadConversations() {

    const userId = await getCurrentUserId();

    const { data, error } = await supabaseClient
        .from("conversations")
        .select("id,title,model,created_at,updated_at")
        .eq("user_id", userId)
        .order("updated_at", { ascending: false });

    if (error) {
        throw databaseError(error);
    }

    conversations = data || [];

    renderChatList();
}

async function createConversation(model) {

    const userId = await getCurrentUserId();

    const { data, error } = await supabaseClient
        .from("conversations")
        .insert({
            user_id: userId,
            title: DEFAULT_TITLE,
            model
        })
        .select("id,title,model,created_at,updated_at")
        .single();

    if (error) {
        throw databaseError(error, "Could not create the conversation. Please try again.");
    }

    const conversation = data;

    conversations.unshift(conversation);

    currentConversationId = conversation.id;

    rememberLastConversation();

    renderChatList();

    return conversation.id;
}

async function saveMessage(conversationId, role, content, model) {

    const userId = await getCurrentUserId();

    if (!conversationId || !["user", "assistant"].includes(role) || !content) {
        throw new ApiError("Invalid message data.", 400);
    }

    const { data: conversation, error: conversationError } = await supabaseClient
        .from("conversations")
        .select("id,title")
        .eq("id", conversationId)
        .eq("user_id", userId)
        .single();

    if (conversationError || !conversation) {
        throw databaseError(conversationError, "Conversation not found.");
    }

    const { data: message, error: messageError } = await supabaseClient
        .from("messages")
        .insert({
            conversation_id: conversationId,
            role,
            content,
            model
        })
        .select("id,conversation_id,role,content,model,created_at")
        .single();

    if (messageError) {
        throw databaseError(messageError, "Could not save the message. Please try again.");
    }

    const changes = {
        updated_at: new Date().toISOString()
    };

    if (role === "user" && conversation.title === DEFAULT_TITLE) {

        let newTitle = content.replace(/\n/g, " ").trim();

        if (newTitle.length > 48) {
            newTitle = newTitle.slice(0, 48).trimEnd() + "...";
        }

        if (newTitle) {
            changes.title = newTitle;
        }
    }

    const { data: updatedConversation, error: updateError } = await supabaseClient
        .from("conversations")
        .update(changes)
        .eq("id", conversationId)
        .eq("user_id", userId)
        .select("id,title,model,created_at,updated_at")
        .single();

    if (updateError) {
        throw databaseError(updateError, "Message was saved, but the conversation could not be updated.");
    }

    const index = conversations.findIndex(item => item.id === conversationId);

    if (index !== -1 && updatedConversation) {
        conversations[index] = updatedConversation;
    }

    return { message };
}

async function loadMessages(conversationId) {

    const userId = await getCurrentUserId();

    const { data: conversation, error: conversationError } = await supabaseClient
        .from("conversations")
        .select("id")
        .eq("id", conversationId)
        .eq("user_id", userId)
        .single();

    if (conversationError || !conversation) {
        throw databaseError(conversationError, "Conversation not found.");
    }

    const { data, error } = await supabaseClient
        .from("messages")
        .select("id,conversation_id,role,content,model,created_at")
        .eq("conversation_id", conversationId)
        .order("created_at", { ascending: true });

    if (error) {
        throw databaseError(error, "Could not load messages. Please try again.");
    }

    return data || [];
}

async function renameConversation(conversationId) {

    const title = el.modalInput.value.trim();

    if (!title) {
        showToast("Please enter a chat name.");
        return;
    }

    try {

        const userId = await getCurrentUserId();

        const { data, error } = await supabaseClient
            .from("conversations")
            .update({
                title,
                updated_at: new Date().toISOString()
            })
            .eq("id", conversationId)
            .eq("user_id", userId)
            .select("id,title,model,created_at,updated_at")
            .single();

        if (error) {
            throw databaseError(error, "Could not rename the conversation. Please try again.");
        }

        const index = conversations.findIndex(item => item.id === conversationId);

        if (index !== -1) {
            conversations[index] = data;
        }

        closeDialog();
        renderChatList();

    } catch (error) {

        handleAuthFailure(error);
        showToast(error.message);
    }
}

async function deleteConversation(conversationId) {

    try {

        const userId = await getCurrentUserId();

        const { error: messagesError } = await supabaseClient
            .from("messages")
            .delete()
            .eq("conversation_id", conversationId);

        if (messagesError) {
            throw databaseError(messagesError, "Could not delete the conversation messages. Please try again.");
        }

        const { error: conversationError } = await supabaseClient
            .from("conversations")
            .delete()
            .eq("id", conversationId)
            .eq("user_id", userId);

        if (conversationError) {
            throw databaseError(conversationError, "Could not delete the conversation. Please try again.");
        }

        conversations = conversations.filter(item => item.id !== conversationId);

        if (currentConversationId === conversationId) {

            currentConversationId = null;
            history = [];

            rememberLastConversation();

            showWelcome();
        }

        closeDialog();
        renderChatList();

    } catch (error) {

        handleAuthFailure(error);
        showToast(error.message);
    }
}

async function openConversation(conversationId) {

    if (isSending) {
        showToast("Please wait for the current reply to finish.");
        return;
    }

    const conversation = conversations.find(item => item.id === conversationId);

    if (!conversation) {
        return;
    }

    currentConversationId = conversationId;

    rememberLastConversation();

    if (conversation.model && el.modelSelect.querySelector(`option[value="${CSS.escape(conversation.model)}"]`)) {
        el.modelSelect.value = conversation.model;
    }

    renderChatList();

    try {

        const messages = await loadMessages(conversationId);

        // The user may have switched chats while we were loading.
        if (currentConversationId !== conversationId) {
            return;
        }

        history = messages.map(message => ({
            role: message.role,
            content: message.content
        }));

        renderMessages(messages);

    } catch (error) {

        handleAuthFailure(error);
        showToast(error.message);
    }
}

function startNewChat() {

    if (isSending) {
        showToast("Please wait for the current reply to finish.");
        return;
    }

    currentConversationId = null;
    history = [];

    rememberLastConversation();

    showWelcome();

    renderChatList();

    closeSidebarOnMobile();

    el.input.focus();
}

function rememberLastConversation() {

    if (!session || !session.user) {
        return;
    }

    const key = LAST_CHAT_KEY_PREFIX + session.user.id;

    if (currentConversationId) {
        localStorage.setItem(key, currentConversationId);
    } else {
        localStorage.removeItem(key);
    }
}


/* -----------------------------------------------------
   Sending
   ----------------------------------------------------- */

function handleAuthFailure(error) {

    if (error && error.status === 401) {

        supabaseClient.auth.signOut().finally(() => {
            goToLogin("expired");
        });
    }
}

async function sendMessage() {

    if (isSending) {
        return;
    }

    const text = el.input.value.trim();

    if (!text) {
        return;
    }

    if (text.length > MAX_MESSAGE_CHARS) {
        showToast(`Message is too long. Please keep it under ${MAX_MESSAGE_CHARS.toLocaleString("en-US")} characters.`);
        return;
    }

    isSending = true;
    el.sendButton.disabled = true;

    const model = el.modelSelect.value;

    // Prior messages only. The current message is sent separately.
    const priorHistory = history.slice(-MAX_HISTORY_MESSAGES);

    el.input.value = "";
    resizeTextarea();

    addMessage("user", text);

    const thinking = addThinking();

    try {

        if (!currentConversationId) {
            await createConversation(model);
        }

        const conversationId = currentConversationId;

        try {

            await saveMessage(conversationId, "user", text, model);

        } catch (error) {

            console.error("Could not save message:", error);
        }

        const reply = await apiRequest("/v1/chat", {
            method: "POST",
            auth: true,
            timeout: CHAT_TIMEOUT_MS,
            body: {
                message: text,
                model,
                history: priorHistory
            }
        });

        thinking.remove();

        const replyText = reply.reply || "No response received.";
        const replyModel = reply.name || model;

        addMessage("assistant", replyText, replyModel);

        history = [
            ...priorHistory,
            { role: "user", content: text },
            { role: "assistant", content: replyText }
        ];

        try {

            await saveMessage(conversationId, "assistant", replyText, model);

        } catch (error) {

            console.error("Could not save reply:", error);
        }

        await loadConversations();

    } catch (error) {

        console.error("Send error:", error);

        thinking.remove();

        handleAuthFailure(error);

        addNotice(error.message);

    } finally {

        isSending = false;
        el.sendButton.disabled = false;
        el.input.focus();
    }
}

   Composer

function resizeTextarea() {

    el.input.style.height = "auto";

    el.input.style.height = Math.min(el.input.scrollHeight, 180) + "px";

el.input.addEventListener("input", resizeTextarea);

    try {

        const userId = await getCurrentUserId();

        const { data, error } = await supabaseClient
            .from("conversations")
            .update({
                model: el.modelSelect.value,
                updated_at: new Date().toISOString()
            })
            .eq("id", currentConversationId)
            .eq("user_id", userId)
            .select("id,title,model,created_at,updated_at")
            .single();

        if (error) {
            throw databaseError(error, "Could not update the selected model. Please try again.");
        }

        const conversation = conversations.find(item => item.id === currentConversationId);

        if (conversation && data) {
            Object.assign(conversation, data);
        }

    } catch (error) {

        handleAuthFailure(error);

});

document.addEventListener("click", (event) => {

    if (
        el.sidebar.classList.contains("open") &&
        !el.sidebar.contains(event.target) &&
        event.target !== el.menuToggle
    ) {
        closeSidebarOnMobile();
    }
});

el.newChatButton.addEventListener("click", startNewChat);

el.themeButton.addEventListener("click", toggleTheme);

el.aboutButton.addEventListener("click", openAboutDialog);

el.logoutButton.addEventListener("click", logout);

el.bannerRetry.addEventListener("click", checkApiStatus);


/* -----------------------------------------------------
   Auth state
   ----------------------------------------------------- */

supabaseClient.auth.onAuthStateChange((event, newSession) => {

    if (event === "SIGNED_OUT" || !newSession) {
        goToLogin();
        return;
    }

    session = newSession;
});


/* -----------------------------------------------------
   Start
   ----------------------------------------------------- */

async function openInitialConversation() {

    await loadConversations();

    const savedId = localStorage.getItem(LAST_CHAT_KEY_PREFIX + session.user.id);

    const saved = conversations.find(item => item.id === savedId);

    const target = saved || conversations[0];

    if (target) {
        await openConversation(target.id);
    } else {
        showWelcome();
    }
}

async function start() {

    applyTheme();

    resizeTextarea();

    const { data, error } = await supabaseClient.auth.getSession();

    if (error || !data.session) {
        goToLogin();
        return;
    }

    session = data.session;

    el.userEmail.textContent = session.user.email || "";

    showWelcome();

    await Promise.all([
        loadModels(),
        checkApiStatus()
    ]);

    try {

        await openInitialConversation();

    } catch (error) {

        console.error("Initial load error:", error);

        handleAuthFailure(error);

        if (apiOnline) {
            showToast(error.message);
        }
    }

    el.input.focus();
}

start();

</script>
